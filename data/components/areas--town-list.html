<div class="wrap areas__inner">
<div class="areas__text">
{{#heading}}<{{htag}} id="{{id}}-h">{{{heading_html}}}</{{htag}}>
{{/heading}}{{#intro}}<div class="prose">{{{intro}}}</div>
{{/intro}}<ul class="areas__towns" role="list">{{#items}}<li>{{name}}</li>{{/items}}</ul>
</div>
{{#has_place}}<dl class="areas__place">
{{#hours}}<div><dt>{{hours_label}}</dt><dd>{{hours}}</dd></div>
{{/hours}}{{#address}}<div><dt>{{address_label}}</dt><dd>{{address}}</dd></div>
{{/address}}</dl>
{{/has_place}}</div>
