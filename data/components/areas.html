<div class="wrap areas__inner">
<div class="areas__text">
{{#heading}}<{{htag}} id="{{id}}-h">{{heading}}</{{htag}}>
{{/heading}}{{#intro}}<div class="prose">{{{intro}}}</div>
{{/intro}}<ul class="areas__list" role="list">{{#items}}<li>{{name}}</li>{{/items}}</ul>
{{#note}}<div class="areas__note prose muted">{{{note}}}</div>
{{/note}}</div>
{{#art}}<figure class="areas__map"><img src="{{src}}" alt="{{alt}}" width="{{width}}" height="{{height}}" loading="lazy" decoding="async"></figure>
{{/art}}</div>
