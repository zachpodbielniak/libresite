<div class="wrap booking-calendar__inner" data-booking-url="{{booking_url}}">
<div class="section-head"><{{htag}} id="{{id}}-h">{{{heading_html}}}</{{htag}}>{{#body}}<div class="prose">{{{body}}}</div>{{/body}}</div>
<p class="booking-calendar__fallback">Choose a time on the <a href="{{booking_url}}">booking page</a>.</p>
<div class="booking-calendar__app" hidden>
<div class="booking-calendar__nav"><button type="button" class="button button--ghost button--small" data-booking-prev aria-label="Previous month">Previous</button><h3 data-booking-month aria-live="polite"></h3><button type="button" class="button button--ghost button--small" data-booking-next aria-label="Next month">Next</button></div>
<div class="booking-calendar__weekdays" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
<div class="booking-calendar__days" data-booking-days role="group" aria-label="Available days"></div>
<p class="booking-calendar__status" data-booking-status role="status" aria-live="polite"></p>
<div data-booking-times hidden><h3 data-booking-day-title></h3><div class="booking-calendar__times" data-booking-time-list role="group" aria-label="Available times"></div></div>
<form action="{{booking_url}}" method="post" data-booking-form hidden>
<input type="hidden" name="start" data-booking-start>
<p data-booking-picked></p>
<p class="booking-calendar__privacy">Before sharing your details, read our <a href="privacy.html">Privacy</a> and <a href="terms.html">Terms</a>.</p>
<div class="field"><label for="{{id}}-name">Name</label><p class="field-error" id="{{id}}-name-error" data-field-error></p><input id="{{id}}-name" name="name" autocomplete="name" maxlength="200" required aria-describedby="{{id}}-name-error"></div>
<div class="field"><label for="{{id}}-email">Email</label><p class="field-error" id="{{id}}-email-error" data-field-error></p><input id="{{id}}-email" name="email" type="email" autocomplete="email" maxlength="254" required aria-describedby="{{id}}-email-error"></div>
{{#services}}<fieldset class="field field--choice{{#toggle}} field--toggle{{/toggle}}" aria-describedby="{{id}}-service-error">
<legend>{{legend}}</legend>
<p class="field-error" id="{{id}}-service-error" data-field-error></p>
<div class="choice-list">
{{#choices}}<label class="choice"><input type="radio" id="{{cid}}" name="service" value="{{value}}" aria-describedby="{{id}}-service-error"><span>{{label}}</span></label>
{{/choices}}</div>
</fieldset>
{{/services}}<div class="field"><label for="{{id}}-notes">Note (optional)</label><p class="field-error" id="{{id}}-notes-error" data-field-error></p><textarea id="{{id}}-notes" name="notes" maxlength="4000" rows="3" aria-describedby="{{id}}-notes-error"></textarea></div>
<div class="field field--check"><input type="checkbox" id="{{id}}-agree" name="agree" value="yes" required aria-describedby="{{id}}-agree-error"><label for="{{id}}-agree">{{agree}}</label><p class="field-error" id="{{id}}-agree-error" data-field-error></p></div>
<button class="button" type="submit">Confirm booking</button>
</form>
<div class="booking-calendar__confirmed" data-booking-confirmed role="status" aria-live="polite" tabindex="-1" hidden></div>
</div></div>
