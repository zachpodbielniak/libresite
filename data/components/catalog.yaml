      columns: Place names in columns.
      map: A drawn map with the business at the center and the places in rings around it.
      town-list: 'The supplied towns in columns under one line, the hours and address beside them. The builder fills the facts.'
      address-band: 'The supplied address, hours and towns in one band. The builder fills the facts.'
      location-blocks: 'One block per supplied place with its address, hours and the call. The builder fills the facts.'
      shop-chooser: 'Two to four supplied shops side by side, each with its address, hours and phone. The builder fills the facts.'
    slots:
      heading: {type: text, max: 140}
      intro: {type: rich, max: 600}
      items: {type: items, min_items: 1, max_items: 60, fields: {name: {type: text, required: true, max: 60}}}
      art: {type: image}
      note: {type: rich, max: 400}
      hours: {type: text, max: 400, note: "town-list and address-band: the supplied hours, from the builder."}
      address: {type: text, max: 200, note: "town-list and address-band: the supplied address, from the builder."}
      places:
        type: items
        max_items: 4
        note: "location-blocks and shop-chooser: the supplied places, from the builder."
        fields:
          name: {type: text, required: true, max: 60}
          address: {type: text, max: 200}
          hours: {type: text, max: 200}
          phone: {type: text, max: 40}
          link: {type: link}
  contact-card:
    summary: The supplied ways to get in touch, in one block with clear actions.
    variants:
      card: A raised card.
      strip: A full-width strip.
      split: The title beside the details.
      band: An accent band across the page.
      outline: A thick outlined box.
    slots:
      heading: {type: text, required: true, max: 120}
      body: {type: rich, max: 600}
      items: {type: items, min_items: 1, max_items: 6, fields: {label: {type: text, required: true, max: 40}, value: {type: text, required: true, max: 120}, link: {type: link}}}
      actions: {type: links, max_items: 2}
  reviews:
    summary: Supplied customer quotes with their names, drawn by the builder from the order's reviews. Only when the order supplies them; never write, shorten or change a quote.
    variants:
      card-grid: Many short quotes with names, three a row.
      quote-headline: Each quote led by a short headline taken word for word from it.
    slots:
      heading: {type: text, max: 140}
      intro: {type: rich, max: 400}
      items:
        type: items
        min_items: 1
        max_items: 9
        fields:
          quote: {type: text, required: true, max: 400}
          name: {type: text, required: true, max: 80}
          source: {type: text, max: 80}
          headline: {type: text, max: 80}
  about:
    summary: The business in a few true sentences, on the home page. Only supplied facts such as the year it started, where it works and how it works; never invented people, awards or history.
    variants:
      history: 'The supplied starting year set large beside a short story.'
      photo-story: 'One of the owner''s own photos beside a short story and one link.'
      owner-letter: 'A short letter from the business beside one of the owner''s own photos, signed with the business name.'
    slots:
      kicker: {type: text, max: 80}
      heading: {type: text, required: true, max: 140}
      body: {type: rich, required: true, max: 1200}
      since: {type: text, max: 12, note: "history: the supplied year, from the builder."}
      link: {type: link}
      art: {type: image, note: "photo-story: the builder gives it one of the owner's own photos."}
      signature: {type: text, max: 80, note: "owner-letter: the business name, from the builder."}
  contact:
    summary: How to reach the business, on the home page. The supplied details beside one clear next step; the builder draws the phone and the primary action.
    variants:
      split: The heading, a line and the one primary action on the left; the supplied details in a card on the right.
      call-first: A large call button with the details beside it. Only with a supplied phone.
    slots:
      heading: {type: text, required: true, max: 120}
      body: {type: rich, max: 600}
      items: {type: items, max_items: 6, fields: {label: {type: text, required: true, max: 40}, value: {type: text, required: true, max: 160}, link: {type: link}}}
  module:
    summary: One of the site's supplied podbay modules, such as a booking or contact form, drawn by the builder from the plan's modules. Only when the plan lists modules; set module to its id and write only the words around it. At most once per page.
    variants:
      stacked: The heading above the module.
      aside: Heading and notes beside the module on wide screens.
      card: The module in a raised card.
    slots:
      heading: {type: text, max: 140}
      body: {type: rich, max: 600}
      module: {type: text, required: true, max: 64, note: "The id of a module the plan lists in modules. Never invent one."}
  call:
    summary: The business's supplied phone number as one large click-to-call button, with the supplied email beside it. From the builder; only when the site has a supplied phone. Never write the number yourself.
    variants:
      panel: A bordered panel with the call button set large.
      band: A full-width tinted band.
      inline: One quiet line under a rule.
    slots:
      heading: {type: text, max: 140}
      body: {type: rich, max: 400}
  booking-calendar:
    summary: The business's live open times, drawn from its supplied booking page. Only when site.booking is present. The builder supplies the booking address; write only the heading and introduction.
    variants:
      month: A phone-first month of open days, followed by times and a short booking form.
    slots:
      heading: {type: text, required: true, max: 140}
      body: {type: rich, max: 400}
  notice:
    summary: A short announcement, such as holiday hours or a change of address.
    variants:
      accent: On the accent color.
      quiet: A bordered line.
      banner: A solid band in the ink colour.
      pill: A centred rounded pill.
      side: An accent bar down the left edge.
      ticket: A dashed tear-off edge.
    slots:
      text: {type: rich, required: true, max: 300}
      link: {type: link}
  locations:
    summary: Several places with their address, hours and a link each.
    variants:
      cards: One card per place.
      list: A list of places.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 1
        max_items: 20
        fields:
          name: {type: text, required: true, max: 80}
          address: {type: rich, required: true, max: 300}
          hours: {type: text, max: 160}
          art: {type: image}
          link: {type: link}
  specs:
    summary: A specification sheet in labeled groups, for products, rooms or projects.
    variants:
      groups: Groups side by side.
      sheet: One long ruled sheet.
    slots:
      heading: {type: text, max: 140}
      groups:
        type: items
        min_items: 1
        max_items: 8
        fields:
          name: {type: text, required: true, max: 60}
          items: {type: items, min_items: 1, max_items: 16, fields: {label: {type: text, required: true, max: 60}, value: {type: text, required: true, max: 160}}}
  directory:
    summary: An A to Z list of entries, grouped by first letter automatically.
    variants:
      columns: Letter groups in columns.
      list: Letter groups one after another.
    slots:
      heading: {type: text, max: 140}
      intro: {type: rich, max: 600}
      items:
        type: items
        min_items: 2
        max_items: 120
        fields:
          title: {type: text, required: true, max: 100}
          note: {type: text, max: 120}
          link: {type: link}
  links:
    summary: Onward links to related pages.
    variants:
      list: A simple list.
      tiles: Large linked tiles.
      inline: Links in a sentence-like row.
      cards: Links as bordered cards.
      numbered: A running number before each link.
      arrows: Big rows with a large arrow at the right.
      columns: Two ruled columns of links.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 1
        max_items: 8
        fields:
          link: {type: link, required: true}
          body: {type: text, max: 200}
  custom:
    summary: An escape hatch for one signature moment the catalog cannot express. Well-formed XHTML using the site's CSS variables; style it through the page css. No scripts, forms, iframes, inline event handlers, style attributes or remote URLs.
    variants:
      contained: Inside the content width.
      bleed: Across the full viewport width.
    slots:
      label: {type: text, required: true, max: 120, note: "Accessible name for the region."}
      html: {type: html, required: true, max: 12000}
  showcase:
    summary: Large feature panels, one per project, service or product, each with artwork and a short pitch.
    variants:
      alternating: Wide panels whose artwork alternates sides.
      overlap: Artwork with a text card overlapping one corner.
      full: Artwork edge to edge with the text beneath, one panel after another.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 1
        max_items: 6
        fields:
          art: {type: image, required: true}
          kicker: {type: text, max: 60}
          title: {type: text, required: true, max: 100}
          body: {type: rich, max: 600}
          link: {type: link}
  big-list:
    summary: An oversized typographic list of links, like a table of contents or an index of work.
    variants:
      plain: Huge titles divided by rules.
      numbered: Each line numbered, with its meta at the right.
      invert: Lines fill with the accent on hover and focus.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 2
        max_items: 20
        fields:
          title: {type: text, required: true, max: 80}
          meta: {type: text, max: 60}
          link: {type: link}
  story:
    summary: A scrolling sequence beside one artwork that stays in view. For a process, a history or how something is made.
    variants:
      left: Artwork held on the left.
      right: Artwork held on the right.
    slots:
      heading: {type: text, max: 140}
      art: {type: image, required: true}
      items:
        type: items
        min_items: 2
        max_items: 8
        fields:
          kicker: {type: text, max: 40}
          title: {type: text, required: true, max: 100}
          body: {type: rich, required: true, max: 800}
  profile:
    summary: One supplied person, such as a founder or the owner, with portrait artwork, role and a few words. Never invent people.
    variants:
      side: Portrait beside the text.
      centered: Portrait above centered text.
      quote: The person's supplied words set large beside a small portrait.
    slots:
      heading: {type: text, max: 140}
      art: {type: image}
      name: {type: text, required: true, max: 80}
      role: {type: text, max: 80}
      body: {type: rich, max: 1200}
      quote: {type: text, max: 300, note: "Only words the person is supplied as saying."}
  badges:
    summary: Supplied credentials, memberships, guarantees or standards. Never invent any.
    variants:
      row: A row of outlined labels.
      seals: Round seals with a label and note.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 1
        max_items: 12
        fields:
          label: {type: text, required: true, max: 60}
          note: {type: text, max: 120}
  offer:
    summary: One highlighted offer, package or ticket with its supplied price and what it includes.
    variants:
      ticket: A ticket with a perforated stub holding the price.
      card: A bold card with the price large.
    slots:
      kicker: {type: text, max: 60}
      heading: {type: text, required: true, max: 120}
      price: {type: text, max: 40, note: "Only a supplied price."}
      note: {type: text, max: 120, note: "Such as per person or valid until."}
      body: {type: rich, max: 600}
      includes: {type: items, max_items: 10, fields: {text: {type: text, required: true, max: 120}}}
      actions: {type: links, max_items: 2}
# Extra component variants (docs/components.org, "Component variants").
# Each joins its component's variants at load, so page writers may name it
# like any other; its styles are NAME--VARIANT.css, added only to sites
# that render it. They restyle the component's own markup.
extra_variants:
  services:
    ledger: Each service under a heavy rule with a large running number, two to a row.
    tiles: Solid tiles alternating between the surface and the ink, names set large.
  voices:
    stack: The first quote set large under an oversized quotation mark, the rest beside a rule.
    ribbon: Quote cards in one row that scrolls sideways and snaps.
  steps:
    path: Numbered stops on a dashed route down the left.
    chapters: Each step a chapter, its number huge in outline between rules.
  faq:
    chat: Questions as speech bubbles, answers replying from the other side.
    index: Questions as a grid of short cards opened by an accent bar.
  cta:
    stripe: The call in a box framed by diagonal accent stripes.
    note: The call on a pinned, slightly turned note with tape.
  contact-card:
    ticket: The details on a ticket with notched sides and a dashed tear line.
    postcard: A postcard, words on the left and the details on ruled lines on the right.
  gallery:
    polaroid: Prints in thick paper frames, each turned a little.
    filmstrip: Pictures in one dark band that scrolls sideways, edged with sprocket holes.
# Extra look values (docs/components.org, "Look"). Each joins its axis at
# load for themes to wear; its styles are look-AXIS-VALUE.css, added only to
# sites that wear it.
extra_looks:
  align:
    right: Headings and intros set to the right where the column has room.
    stagger: Every other section sets its heading and intro to the right where the column has room.
  nav:
    boxed: Each link in a hairline box, the current page filled.
    dots: A small accent dot between links.
    bold: Heavy, slightly larger links.
    bar: An accent bar over the current page.
  footer:
    accent: The footer painted in the accent.
    centered: Everything in the footer in one centred column.
    ruled: A heavy rule over the footer and its name set large.
  rhythm:
    airy: Sections stand apart with extra air between them.
  heads:
    underline: Section headings underlined in the accent.
    dash: A short accent dash leads each section heading.
    boxed: Section headings set in a block of ink.
  buttons:
    soft: Tinted, rounded buttons with accent text.
    block: Square, heavy, spaced capitals.
    arrow: A trailing arrow on every button.
  panels:
    paper: Soft paper cards with a hairline edge and a low shadow.
    stack: Cards with two offset layers behind them.
    dashed: Cards drawn with a dashed edge.
  header:
    underlined: A thick accent rule under the header.
    roomy: A taller header with a larger name.
  lettering:
    wide: The page headline in widely spaced capitals.
    italic: The page headline set in italic.
  images:
    blob: Pictures in a soft organic shape.
    tilt: Pictures turned slightly, one way then the other.
# Wider option pools (docs/components.org, "Look"). Each list joins the
# block it names when the library loads: looks join their axes
# (look-AXIS-VALUE.css) and openings join a home opening component
# (COMPONENT--VARIANT.css).
wider:
  looks:
    panels:
      capped: Surface cards under a thick accent cap along the top edge.
      brutal: Paper cards in a heavy ink frame over a hard accent block shadow.
      accent: Solid accent panels with accent-ink text.
      ticket: Surface cards with a round bite out of each corner, like a ticket.
      well: Panels pressed into the page, a surface fill under an inner shadow.
      folded: Surface cards with the top corner turned down, like a dog-eared page.
      marker: No box; each item sits on a hairline led by a short thick accent mark.
      halo: Rounded paper cards ringed by an accent line set just off their edge.
      edge: Paper cards with a thick accent bar down their leading edge.
    footer:
      card: The footer's contents in a raised paper card on the surface band.
      slim: One compact row on the page colour, the name, note and links side by side.
      ribbon: The name on an accent label hanging from an accent rule along the top edge.
      directory: The links in a ruled grid under the name, each with a trailing arrow.
      arched: The footer band rises in one wide curve at its top edge.
      striped: A band of diagonal accent and ink stripes along the top edge, like safety tape.
      typed: Everything in small monospaced type between dotted rules, like a spec sheet.
      chips: On the page colour, every link set in an outlined pill.
      split: The name and note on one half, the links in a column of large type on the other, an accent rule between.
      block: The name, note and social links in a solid ink block beside the links.
      legend: The footer drawn as an outlined box, the name set into its top edge.
      letterhead: The name centred across the footer between double rules, in spaced small capitals.
      reversed: The links first in a ruled bar, then the name set large with its note.
    header:
      reversed: Navigation on the left and the wordmark on the right.
      accent: The whole bar painted in the accent, with accent-ink text.
      spread: The links centred in the bar, between the wordmark and the action button.
      bilevel: The wordmark and action on top, the links on a full-width tinted strip beneath.
      offset: The bar as a square ink-outlined card with a hard offset shadow.
      divided: Strong rules above and below, and full-height rules between the wordmark, the links and the action.
      slab: The wordmark reversed out of a solid ink slab running in from the page edge.
      ledger: Double ink rules above and below, the wordmark in small spaced capitals.
      slim: A compact bar under a heavy ink rule along the top of the page, with a small name.
      wash: A soft accent wash across the bar, fading into the paper.
      angled: The bar on the surface tint, its lower edge cut on a slant.
      nameplate: An oversized heavy wordmark, the links level with its foot, over a thick ink rule.
    nav:
      highlight: The current page underscored by a broad highlighter stroke in the accent.
      tabs: Links as tabs; the current page on a tinted tab with an accent base.
      numbered: Each main link led by a small running number.
      filled: Square links; the current page on a solid accent block.
      brackets: Monospace links; the current page held in accent square brackets.
      muted: Quiet links in the muted colour; the current page in ink and heavy.
      point: A small accent dot under the current page instead of a line.
      circled: The current page ringed in an accent oval, as if circled by hand.
      keys: Links as raised keys; the current page pressed in.
      segmented: The main links on one rounded tinted track; the current page a raised segment.
      wavy: Italic links; the current page under a wavy accent line.
      arrow: An accent arrow leads the current page.
    rhythm:
      sheets: Every section a rounded paper sheet laid on a surface-coloured page.
      stacked: Each section slides up over the one before with rounded top corners and a soft shadow.
      fade: The page tone drifts from paper to surface and back, section by section, with no hard edge.
      contrast: Every other section turns to ink, light and dark in turn.
      spine: A thin rule runs down beside the column with an accent dot where each section starts.
      ribbons: Every other section is a surface ribbon run in from one side and rounded at its end, the sides taking turns.
      ledger: The column is ruled down both sides, with a double rule across it between sections.
    photos:
      matted: Each photo in a wide surface-coloured mat with a hairline edge, like a framed print.
      arch: Each photo shaped as an arch, rounded over the top.
      feather: Photos fade softly into the page along every edge.
      cut: Photos with two corners cut off on the diagonal, like a stamped plate.
      window: A fine light line drawn just inside each photo's edge, like a window mount.
      stacked: Each photo sits on two offset sheets, like a small pile of prints.
    lettering:
      marker: A broad accent highlighter stroke under every line of the page headline.
      shadow: The page headline casts a hard accent shadow, like a painted sign.
      leadin: The first line of reading text opens in spaced small capitals.
      initial: The page headline opens on an oversized initial in the accent.
      twotone: The first line of the page headline in the accent, the rest in ink.
    heads:
      highlight: A broad accent marker stroke behind each line of the heading.
      caps: Compact, widely spaced heavy capitals.
      trail: An accent line runs on from the heading to the edge of its column.
      bracket: The heading held between square accent brackets.
      framed: The heading inside a closed double-ruled frame.
      newsprint: A heavy rule above and a hairline below, across the column, like a newspaper section.
      shadow: Heavy headings with a hard offset shadow in the accent, like a painted sign.
      initial: The first letter set larger and heavier in the accent.
      panel: The heading set on a tinted band with an accent foot.
    buttons:
      outline: Heavy ink outlines that fill with the accent on hover; secondary buttons are underlined labels.
      key: Chunky keycaps on a solid base edge that press down on hover.
      slant: Parallelograms with sloped ends.
      knob: Rounded buttons ending in a round disc that holds an arrow.
      ticket: Cut like a ticket, notched at both ends with a perforation by the stub.
      ring: Heavy-edged labels with a fine ring just inside the edge, like a seal.
      ink: Solid ink buttons with an accent strip at the leading edge.
      large: Oversized, softly rounded buttons with a bold label, made for a thumb.
      chevron: Buttons that point forward like a road sign.
      wide: Long square bars with the label at the start and an arrow in its own cell at the far end.
  openings:
    hero:
      slab: The opening on a rounded block of the accent, the picture beside the words and hanging below its edge.
    cover:
      band: A wide picture with the words on a solid band of ink that runs in from the left over its foot.
      letterbox: The headline large across the column, the picture as a wide strip from edge to edge, then the lede and buttons side by side.
# Bold openings and forms (docs/components.org, "Bold openings and forms").
# Rebuilt from scratch after the survey in docs/inspiration.org; nothing is
# copied. openings join the home opening components like the wider block's
# (COMPONENT--VARIANT.css), pictures says what each does with a picture
# (needs, shows or hides), and components are new section components
# (NAME.html, NAME.css).
bold:
  openings:
    cover:
      flood: The whole first screen in the accent, the headline in huge capitals in the accent's ink and the picture knocked back to a dark print beneath it.
      wordmark: The picture full width, the headline set huge across its foot on a band of the page colour that bites into it.
      halves: Half the screen a flat block of the accent holding a heavy headline, the other half the picture at full height.
      tint: The picture washed entirely in the accent, a heavy headline in the accent's ink over it.
      stub: The picture full-bleed with the words on a ticket stub pinned in its top corner, ruled and notched.
      cinema: The picture as a wide cinema screen between ink bars, the headline below it in spaced capitals like a title card.
    hero:
      arch: A centred headline on the page colour, the picture rising from below it in a tall arch.
      brutal: The headline, words, buttons and picture as tiles in heavy ink frames with hard offset shadows, in the accent and the surface.
      kinetic: A headline set very large that rises out of a mask on arrival, its emphasis swept in the accent, then drifts back as the page scrolls.
      breakout: The words on an ink block, the picture breaking out above the block's top edge, with a drawn arrow pointing at the first button.
  pictures:
    cover/flood: needs
    cover/wordmark: needs
    cover/halves: needs
    cover/tint: needs
    cover/stub: needs
    cover/cinema: needs
    hero/arch: needs
    hero/brutal: shows
    hero/kinetic: shows
    hero/breakout: needs
  components:
    slabs:
      summary: Offers as wide stacked slabs in turning grounds, each numbered, its name set large beside its words.
      variants:
        turning: Slabs turn between the surface, the ink and the accent.
        ruled: Slabs on the page colour between heavy rules, the number in the accent.
      slots:
        heading: {type: text, max: 140}
        intro: {type: rich, max: 600}
        items:
          type: items
          min_items: 2
          max_items: 8
          fields:
            title: {type: text, required: true, max: 100}
            body: {type: rich, max: 800}
            link: {type: link}
    menuboard:
      summary: Offers as ruled rows like a menu board, a running number, the name in large type and a round arrow; the row under the pointer tints.
      variants:
        rows: Full-width ruled rows.
        board: Rows on an ink board.
      slots:
        heading: {type: text, max: 140}
        intro: {type: rich, max: 600}
        items:
          type: items
          min_items: 2
          max_items: 12
          fields:
            title: {type: text, required: true, max: 100}
            body: {type: rich, max: 800}
            link: {type: link}
    volumes:
      summary: Offers as chapters, a numbered index of them first, then each under a huge light title with its words beside it.
      variants:
        chapters: Each chapter under a hairline, the title light and huge.
        bold: Each chapter on a tinted band, the title heavy.
      slots:
        heading: {type: text, max: 140}
        intro: {type: rich, max: 600}
        items:
          type: items
          min_items: 2
          max_items: 8
          fields:
            title: {type: text, required: true, max: 100}
            body: {type: rich, max: 800}
            link: {type: link}
    jobsheet:
      summary: A process as a printed job sheet on a dark panel, each step a ruled row with a boxed number and a tick.
      variants:
        sheet: A white sheet on an ink panel.
        carbon: A tinted carbon copy on the accent.
      slots:
        heading: {type: text, max: 140}
        intro: {type: rich, max: 600}
        items:
          type: items
          min_items: 2
          max_items: 8
          fields:
            title: {type: text, required: true, max: 100}
            body: {type: rich, max: 600}
    progress:
      summary: A process down a line that fills in the accent as the visitor scrolls, each step's number lighting as it is reached.
      variants:
        line: Steps down one side of the line.
        sides: Steps alternating either side of the line where the column has room.
      slots:
        heading: {type: text, max: 140}
        intro: {type: rich, max: 600}
        items:
          type: items
          min_items: 2
          max_items: 8
          fields:
            title: {type: text, required: true, max: 100}
            body: {type: rich, max: 600}
    stairs:
      summary: A process as a flight of wide bands, each stepped further in than the last, a huge number on its leading edge.
      variants:
        up: Steps climb from left to right.
        solid: Steps in solid accent bands.
      slots:
        heading: {type: text, max: 140}
        intro: {type: rich, max: 600}
        items:
          type: items
          min_items: 2
          max_items: 6
          fields:
            title: {type: text, required: true, max: 100}
            body: {type: rich, max: 600}
    expect:
      summary: Practical answers as dark fact cards headed by a large number, for what customers are shy to ask.
      variants:
        cards: Ink cards in a grid.
        accent: Accent cards in a grid.
      slots:
        heading: {type: text, max: 140}
        intro: {type: rich, max: 600}
        items:
          type: items
          min_items: 1
          max_items: 9
          fields:
            title: {type: text, required: true, max: 200}
            body: {type: rich, required: true, max: 2000}
    broadsheet:
      summary: Questions set huge and light, one to a hairline row, each answer in a narrow column beside it.
      variants:
        rows: Hairline rows on the page colour.
        ink: Rows on an ink ground.
      slots:
        heading: {type: text, max: 140}
        intro: {type: rich, max: 600}
        items:
          type: items
          min_items: 1
          max_items: 12
          fields:
            title: {type: text, required: true, max: 200}
            body: {type: rich, required: true, max: 2000}
# Asset-first sequences: subject before composition, one material world.
bar:
  components:
    scene:
      summary: An asset-first opening with a reviewed phone crop and a still-first optional native film. Only for a plan with supplied media and visual direction.
      variants:
        full: A full-width environmental scene with copy on a protected solid field.
        split: Large portrait or craft image paired with a short display statement.
        object: A monumental isolated object or close detail on its own material stage.
        right: The split mirrored; the statement on the left, a tall photograph on the right.
        above: A large statement and its action across the top, a wide photograph beneath.
        scrim: A full-bleed photograph with the statement on a solid dark panel over its lower corner; stacked on phones.
      slots:
        heading: {type: text, required: true, max: 52}
        kicker: {type: text, max: 100}
        body: {type: rich, max: 180}
        art: {type: image, required: true}
        portrait: {type: image, required: true}
        actions: {type: links, max_items: 1}
    material:
      summary: The craft or proof beat of one related asset sequence. Source-backed facts are supplied by the builder, never invented.
      variants:
        detail: A close detail at monumental scale beside a short explanation.
        proof: A featured project and its factual band, or honestly labelled illustrative material.
      slots:
        heading: {type: text, required: true, max: 52}
        kicker: {type: text, max: 100}
        body: {type: rich, max: 180}
        art: {type: image, required: true}

# Taste (Ben, 2026-10-21: variety had become gimmicks). openings and
# variants never render on an unthemed site; chroma caps how coloured the
# page and surface may be (0 to 1, max minus min channel). The other values
# stay in the library for themes and explicit options only.
# docs/components.org, "Taste".
taste:
  openings: [hero/slab, hero/brutal, hero/kinetic, hero/arch, cover/flood, cover/tint, cover/stub]
  variants: [cards/polaroid, cards/overlap, gallery/polaroid, cta/note, steps/chapters, jobsheet/sheet]
  chroma: 0.16
# The default design (docs/components.org, "The default design"). Until the
# hand-made templates exist, every unthemed site wears this one calm design:
# each look axis at its default; the home opening, or photo_opening when the
# order supplies photos, and the scene for a plan with a visual sequence;
# and this palette, type pairing and home sequence from identities.yaml.
default:
  opening: hero/centered
  photo_opening: hero/split
  scene: split
  palette: harbor
  typeface: geometric
  home: services-first
# The component library's first slice (docs/components.org, "Presets and the
# picker"). The picker reads this block: which section types a business's
# home lists, which variants content makes eligible, the layout family each
# variant belongs to (two of one family never touch; needs.action keeps a
# layout built around one action to sites whose action it is), the real site each
# variant's arrangement comes from, the owner colour words it knows and the
# words that tell a business's sector. Presets live in themes.yaml.
library:
  weights: {prefer: 6, fit: 10, other: 1}
  fallback_opening: hero/centered
  # Sectors: the words that name a trade, its primary action, its home
