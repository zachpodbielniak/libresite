# SPDX-License-Identifier: AGPL-3.0-or-later
# Component catalog for composed sites. Each component has <name>.html (a
# Mustache-subset template) and optionally <name>.css and <name>.js in this
# directory. Slot types: text, rich, link, links, image, items, fields, choice,
# flag. See docs/components.org before adding or changing a component.
version: 1
# Site-wide look. Each axis changes structure shared by every component
# (look.css); the plan picks one value per axis so two sites that use the same
# components do not share a skeleton. The first value is the default. An axis
# with plain: N deals its default to about N percent of sites, so busy
# backgrounds stay occasional.
looks:
  header:
    summary: How the site header is laid out.
    builder: true
    values:
      bar: Wordmark left, navigation right, a hairline below.
      centered: Wordmark centered above centered navigation.
      stacked: A large wordmark on its own row, navigation in a ruled row beneath.
      inverted: A solid ink-colored bar with paper-colored text.
      floating: An inset rounded bar that floats over the page edge.
      glass: A frosted translucent bar that stays at the top while the page scrolls under it.
  nav:
    summary: How navigation links look.
    values:
      underline: Plain links; the current page is underlined in the accent.
      pill: Links in rounded pills; the current page is filled.
      caps: Small spaced capitals.
      slashes: Links separated by slashes, like a path.
  heads:
    summary: How section headings are set.
    values:
      plain: No ornament.
      rule: A short heavy rule above each heading.
      numbered: Sections are numbered 01, 02, 03 before the heading.
      bar: A thick accent bar at the heading's left edge.
      split: On wide screens the heading sits left and its intro right.
      giant: Oversized, tightly set headings.
  buttons:
    summary: Button shape.
    values:
      square: Rectangles with the token radius.
      pill: Fully rounded.
      underline: Text with a heavy underline and an arrow; no box.
      offset: A hard offset shadow that presses in on hover.
      glass: Luminous pills with a glassy highlight and a soft colored glow.
      hud: Cut-corner monospace capitals, like controls on a heads-up display.
      chrome: Polished metallic gradients with a bright rim, Y2K style.
  panels:
    summary: How cards, tiles and boxed items are surfaced.
    values:
      flat: Tinted surface, no border.
      outlined: Transparent with a strong outline.
      raised: Paper with a soft shadow.
      rules: No box; items are divided by rules.
      inverted: Solid ink panels with paper text.
      glass: Frosted translucent glass that blurs the page behind it, with a bright edge.
      hud: Cut-corner frames with accent corner brackets and an inner glow, like a sci-fi readout.
      deco: Double-rule frames with stepped corners, like art deco.
  rhythm:
    summary: How sections follow one another.
    builder: true
    values:
      even: One continuous page background.
      bands: Alternate sections sit on the surface color, edge to edge.
      divided: A full-width rule between sections.
      tight: Sections close up, with less space between them.
  align:
    summary: Alignment of section headings and intros.
    builder: true
    values:
      left: Left aligned.
      center: Centered headings and intros; content keeps its own alignment.
  images:
    summary: Treatment of artwork.
    values:
      plain: As drawn.
      rounded: Generous rounded corners.
      framed: A thin frame with a mat.
      print: Printed-ink look, blended into the paper.
      shadow: A hard offset shadow in the accent.
      taped: Slightly turned, held on with strips of tape, like a collage.
  footer:
    summary: Footer layout.
    builder: true
    values:
      simple: A quiet surface band with links.
      big: An oversized wordmark across the footer.
      inverted: Solid ink with paper text.
      sitemap: A full sitemap of every page in columns above the fine print.
  texture:
    summary: Background texture on the page.
    plain: 50
    values:
      none: Plain.
      grain: Fine paper grain.
      grid: A faint drafting grid.
      dots: A faint dot grid.
      lines: Faint horizontal ruled lines.
      aurora: Soft, fixed color fields from the accent and surface that glass panels blur.
      scanlines: Very fine horizontal scanlines, like a display.
      stars: A faint scatter of tiny stars.
  motion:
    summary: Scroll motion.
    builder: true
    values:
      none: Static.
      rise: Sections rise gently into view where the browser supports it; never with reduced motion.
      reveal: The opening fades up once as the page loads; never with reduced motion.
      lift: Cards, tiles and images lift slightly under the pointer; never with reduced motion.
  emphasis:
    summary: How words marked *like this* in a heading are drawn.
    values:
      accent: In the accent color.
      italic: In italic display type.
      highlight: Over a highlighter stroke in the accent.
      underline: With a thick hand-drawn underline in the accent.
      outline: In outline letters.
      block: On a solid accent block, like a stamp.
  ornament:
    summary: A small decorative mark between sections.
    values:
      none: Nothing.
      wave: A short wave in the accent.
      zigzag: A short zigzag in the accent.
      dots: Three dots.
      star: A small four-point star.
      rule: A short double rule.
  kicker:
    summary: The small label above headings.
    values:
      mono: Small monospace capitals.
      pill: A rounded pill with a border.
      line: Led by a short accent line.
      accent: Accent-colored capitals.
      number: Tracked capitals with a leading slash.
  backdrop:
    summary: A background behind the page's opening section.
    plain: 50
    values:
      none: The page background.
      glow: Soft glows of the accent and surface colors.
      mesh: A soft multi-color gradient mesh from the tokens.
      stripes: Fine diagonal stripes.
      halftone: A halftone dot fade.
      block: A solid surface band with an accent edge.
      aurora: Large luminous color fields in the accent, like light through glass.
      horizon: A glowing horizon with a receding perspective grid.
  art:
    summary: The drawing style of every original artwork; the artist follows it.
    values:
      open: Whatever suits the plan's motif.
      line: Fine single-weight line drawing with plenty of open space and one accent.
      flat: Flat geometric shapes in solid token colors, no outlines or gradients.
      cutpaper: Layered cut-paper shapes with soft edges and small offset shadows.
      woodcut: Bold carved marks, hatching and high contrast, like a woodcut print.
      blueprint: Technical drawing with thin lines, dimension marks and short labels.
      neon: Glowing strokes in the accent on dark fields, like neon tubes.
  photos:
    summary: Treatment of supplied photographs. Photos of the customer's own people, animals, food or place stay natural unless the brief asks otherwise.
    plain: 40
    values:
      natural: As shot.
      duotone: Two-tone in the ink and accent colors.
      mono: Black and white with lifted contrast.
      grain: A warm film finish with slightly muted color.
      print: A white-bordered print, slightly turned, like a photo on a table.
      soft: A soft, generously rounded mask.
  edges:
    summary: The edge between sections that have their own background.
    plain: 50
    values:
      straight: Straight.
      wave: A gentle wave.
      slant: A slanted edge.
      torn: A torn-paper edge.
      steps: A stepped edge.
  lettering:
    summary: Typographic flourishes.
    plain: 20
    values:
      plain: None.
      dropcap: A large drop cap opens the first paragraph of reading text.
      smallcaps: Small capitals for labels, navigation and table headings.
      gradient: The page's main headline fades from ink into the accent.
      outline: The page's main headline in outline letters.
  links:
    summary: How links in running text are marked.
    values:
      underline: A thin underline.
      thick: A thick underline in the accent.
      highlight: A low accent highlight behind the words.
      wavy: A wavy underline.
      dotted: A dotted underline.
  scheme:
    summary: Light and dark.
    plain: 50
    values:
      fixed: One scheme, as designed.
      auto: Follows the visitor's device, with a matching dark or light version built from the tokens.
  frame:
    summary: The page silhouette, dealt by the builder.
    builder: true
    values:
      top: A header bar across the top and one column below.
      rail: A fixed navigation rail down the left edge beside the content.
      split: A sticky left panel with the wordmark, tagline and navigation; content scrolls on the right.
      center: A narrow centered column under a centered header, like a journal.
      wide: Edge-to-edge sections with generous margins and no column cap.
      offset: Content set right of a wide empty margin, with headings hanging into it.
      masthead: A newspaper masthead with a huge wordmark between rules.
  headpos:
    summary: Where section headings sit, dealt by the builder.
    builder: true
    values:
      top: Above the section content.
      side: In a column beside the section content.
      center: Centered above the section content.
      hang: Hanging into the left margin beside the content.
# Every planned page has a kind. A kind fixes which components may open the
# page and whether wide screens get an in-page contents sidebar. Only home
# may open with a hero: interior pages open with a page header.
kinds:
  home:
    summary: The front door. A confident opening, a short tour of what matters and a clear next step.
    openings: [hero, cover, manifesto, custom, poster]
    suggested: [cards, bento, features, media, statement, marquee, numbers, voices, strip, quote, text, cta, showcase, big-list, story, badges, offer, social]
  index:
    summary: A list of things to choose from, such as work, articles, services or locations. Opens with a page header; the list is the page.
    openings: [page-header]
    suggested: [entries, cards, filter, news, products, directory, bento, links, pager, big-list, showcase, jumpnav, share]
  detail:
    summary: One thing in depth, such as a project, service, dish or product. Key facts up front, then the story, evidence and related items.
    openings: [page-header]
    suggested: [facts, specs, product, recipe, text, figure, compare, carousel, article, callout, table, links, pager, story, share]
    sidebar: true
  article:
    summary: Longform reading such as an essay, guide or case study. A reading column with contents, inline figures and notes.
    openings: [page-header]
    suggested: [lead, article, recipe, figure, callout, table, timeline, glossary, pager, jumpnav, share]
    sidebar: true
  menu:
    summary: A menu or price list. Sections of items with prices and notes, little else.
    openings: [page-header]
    suggested: [menu, specials, pricing, notice, callout, hours, cta]
  visit:
    summary: How to get there and when. Hours, address, directions, practical questions and one clear action.
    openings: [page-header]
    suggested: [hours, location, locations, areas, contact-card, notice, faq, facts, schedule, cta, social]
  about:
    summary: The story, people and values. A quiet opening, longer reading, pictures and milestones.
    openings: [page-header]
    suggested: [lead, text, columns, timeline, team, numbers, voices, press, partners, figure, carousel, quote, statement, profile, story, badges, jobs, social]
  form:
    summary: A page built around one task, such as a booking request, a brief or a sign-up. Explain, then the form, then what happens next.
    openings: [page-header]
    suggested: [text, steps, form, faq]
  services:
    summary: What the business offers. Services with prices where supplied, what is included and how it works.
    openings: [page-header]
    suggested: [services, timetable, checklist, details, tabs, steps, areas, faq, cta, offer, story, badges, showcase]
  pricing:
    summary: Prices and packages. Tiers, what each includes and the questions buyers ask.
    openings: [page-header]
    suggested: [pricing, checklist, table, faq, cta, offer]
  shop:
    summary: Products for sale. A product grid with filters, then practical answers about buying.
    openings: [page-header]
    suggested: [products, notice, faq, checklist, cta, offer]
  contact:
    summary: How to reach the business. Contact details, a form only with a real endpoint, and where to find it.
    openings: [page-header]
    suggested: [contact-card, call, form, location, hours, locations, faq, social]
  gallery:
    summary: A portfolio or photo page. Artworks first, words second.
    openings: [page-header]
    suggested: [gallery, carousel, strip, bento, compare, figure, cta, showcase]
  events:
    summary: What is on. Dates, places and how to join.
    openings: [page-header]
    suggested: [schedule, timetable, news, notice, callout, location, faq, offer, share]
  general:
    summary: Any other interior page. Opens with a page header.
    openings: [page-header]
    suggested: [text, features, columns, split, steps, callout, details, faq, links]
  utility:
    summary: Built-in 404, privacy and terms pages. Not plannable.
    openings: [page-header]
    suggested: [text, links]
    builtin: true
components:
  hero:
    summary: The page opening. The first section of every page renders its heading as the page h1.
    variants:
      statement: Oversized headline with generous space and no artwork; the most typographic opening.
      split: Headline and lede beside one artwork, stacking on small screens.
      banner: Headline and lede above one full-width artwork.
      centered: Headline and lede centered, art below.
      overlap: Headline overlapping the top edge of the art.
      minimal: A single strong line and one action, lots of space.
    slots:
      kicker: {type: text, max: 80, note: "Short label above the heading; omit rather than repeat the site name."}
      heading: {type: text, required: true, max: 140}
      lede: {type: rich, max: 800}
      actions: {type: links, max_items: 2, note: "The first link is the primary action."}
      art: {type: image, note: "Required by split and banner."}
  text:
    summary: A block of prose.
    variants:
      narrow: A single readable column.
      wide: A wider measure for short, broad passages.
      aside: Heading in a side column and prose beside it on wide screens.
      columns: Prose flowing into two columns on wide screens.
      centered: A short centered passage.
      ruled: A heavy rule over a heading column beside the body.
      boxed: The passage on a panel.
      lede: The opening paragraph set large.
      margin: A small label heading hanging in the left margin.
    slots:
      heading: {type: text, max: 140}
      body: {type: rich, required: true, max: 6000}
  article:
    summary: Longform writing split into headed parts, such as an essay or case study.
    variants:
      plain: Parts one after another.
      contents: Adds an in-page table of contents linking to each part.
    slots:
      heading: {type: text, max: 140}
      meta: {type: text, max: 160, note: "A byline, date or reading time. Never invent authors or dates."}
      lede: {type: rich, max: 1200}
      parts:
        type: items
        min_items: 1
        max_items: 16
        fields:
          heading: {type: text, required: true, max: 140}
          body: {type: rich, required: true, max: 6000}
          art: {type: image}
          caption: {type: text, max: 300}
      notes: {type: items, max_items: 20, note: "Numbered notes or sources shown after the parts.", fields: {text: {type: rich, required: true, max: 600}}}
  features:
    summary: A set of short points, principles or offerings.
    variants:
      columns: Two or three columns on wide screens.
      numbered: An ordered sequence, such as a process.
      list: A compact stacked list with rules between items.
      split: Heading on one side, points on the other.
      boxed: Each point in its own panel.
    slots:
      heading: {type: text, max: 140}
      intro: {type: rich, max: 1200}
      items:
        type: items
        min_items: 2
        max_items: 12
        fields:
          title: {type: text, required: true, max: 120}
          body: {type: rich, max: 1200}
          link: {type: link}
  cards:
    summary: Linked entries such as projects, services, articles or locations.
    variants:
      grid: An even grid of cards.
      rows: Wide rows with artwork and text side by side.
      alternating: Rows whose artwork alternates sides for an editorial rhythm.
      numbered: Cards numbered in order.
      bordered: Outlined cards with no art background.
      list: Compact rows with small art.
      overlap: Text panels overlapping the bottom edge of their artwork.
      polaroid: Artwork in thick paper frames, gently tilted, captions beneath.
      minimal: Large titles and meta only; artwork hidden.
    slots:
      heading: {type: text, max: 140}
      intro: {type: rich, max: 1200}
      items:
        type: items
        min_items: 1
        max_items: 24
        fields:
          title: {type: text, required: true, max: 120}
          tag: {type: text, max: 40}
          meta: {type: text, max: 120}
          body: {type: rich, max: 1200}
          link: {type: link}
          art: {type: image}
  filter:
    summary: Linked entries with category buttons that filter the list. Every entry stays visible without JavaScript.
    variants:
      grid: Entries in a grid.
      rows: Entries as wide rows.
    slots:
      heading: {type: text, max: 140}
      intro: {type: rich, max: 1200}
      all_label: {type: text, required: true, max: 40, note: "Label of the button that shows every entry."}
      categories: {type: items, min_items: 2, max_items: 8, fields: {label: {type: text, required: true, max: 40}}}
      empty: {type: text, required: true, max: 200, note: "Message shown when a category has no entries."}
      items:
        type: items
        min_items: 1
        max_items: 48
        fields:
          title: {type: text, required: true, max: 120}
          category: {type: text, required: true, max: 40, note: "Must equal one category label."}
          meta: {type: text, max: 120}
          body: {type: rich, max: 1200}
          link: {type: link}
          art: {type: image}
  media:
    summary: One artwork with a caption, optionally with text.
    variants:
      full: Artwork across the full content width.
      inset: Artwork at reading width.
      split: Artwork beside a heading and body.
      offset: Artwork offset against a colored block.
      framed: Artwork in a thick frame.
      overlay: The caption set on the picture as a corner label.
      stagger: Text on a panel overlapping the picture's lower edge.
      flush: Picture and a painted text column edge to edge.
      cinema: An ultrawide crop with heading and body in two columns below.
      portrait: A tall crop beside a large heading.
    slots:
      art: {type: image, required: true}
      caption: {type: text, max: 300}
      heading: {type: text, max: 140}
      body: {type: rich, max: 2000}
  quote:
    summary: A pull quote from the page's own material. Never a fabricated testimonial.
    variants:
      pull: Large display quotation.
      plain: Quiet inline quotation.
      boxed: In a panel with a large quote mark.
      side: Quote beside a heading rule.
      giant: The quotation set enormous across the full width.
    slots:
      quote: {type: text, required: true, max: 400}
      source: {type: text, max: 120, note: "Only a real, supplied attribution."}
  cta:
    summary: A call to action that closes a page or section.
    variants:
      band: A full-width accent band.
      quiet: A restrained closing line with links.
      split: Heading on one side and actions on the other.
      card: A raised card inside the content width.
      stack: Centered stack with large type.
      giant: A heading set enormous across the width, actions beneath.
      ticket: A notched ticket with a dashed edge.
      outline: A thick accent outline, centred.
      sidebar: A painted title column beside the actions.
      underline: The title runs into a long accent rule leading to the actions.
    slots:
      heading: {type: text, required: true, max: 140}
      body: {type: rich, max: 800}
      actions: {type: links, min_items: 1, max_items: 2}
  faq:
    summary: Questions with expandable answers.
    variants:
      list: Stacked questions.
      columns: Questions in two columns.
      boxed: Each question in a panel.
      numbered: Each question carries a running number.
      split: The heading stays beside the questions.
      cards: Each question a card in a grid.
      ruled: Large questions between heavy rules.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 1
        max_items: 20
        fields:
          question: {type: text, required: true, max: 200}
          answer: {type: rich, required: true, max: 2000}
  facts:
    summary: Labeled facts such as hours, location, scope or service terms. Never invented metrics.
    variants:
      grid: Facts in a grid of tiles.
      list: A definition list.
      inline: Facts in one flowing line.
      big: Values set large.
      cards: Outlined cards.
      ledger: A two-column table of ruled rows.
      ribbon: The facts in one painted strip.
    slots:
      heading: {type: text, max: 140}
      intro: {type: rich, max: 800}
      items:
        type: items
        min_items: 1
        max_items: 16
        fields:
          label: {type: text, required: true, max: 60}
          value: {type: rich, required: true, max: 400}
  pricing:
    summary: Offer tiers or packages with prices supplied by the client.
    variants:
      columns: Tiers side by side.
      stack: Tiers stacked as wide rows.
      minimal: No boxes; tiers divided by rules.
      bold: A painted head strip on each tier.
    slots:
      heading: {type: text, max: 140}
      intro: {type: rich, max: 800}
      tiers:
        type: items
        min_items: 1
        max_items: 4
        fields:
          name: {type: text, required: true, max: 60}
          price: {type: text, required: true, max: 40}
          period: {type: text, max: 40}
          summary: {type: rich, max: 400}
          features: {type: items, max_items: 10, fields: {text: {type: text, required: true, max: 140}}}
          action: {type: link}
          highlight: {type: flag}
  gallery:
    summary: A set of artworks with captions.
    variants:
      grid: An even grid.
      mosaic: A grid where the first artwork is larger.
      strip: One row that scrolls sideways.
      framed: Artworks in frames with captions below.
      masonry: Artworks of mixed heights packed in columns.
      wide: The first picture across the column, the rest below.
      duo: Two large pictures a row.
      stack: One big picture at a time, its caption beside it.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 2
        max_items: 24
        fields:
          art: {type: image, required: true}
          caption: {type: text, max: 200}
  form:
    summary: A labeled form. Local mode builds a downloadable text file in the browser and sends nothing.
    variants:
      stacked: Fields in one column.
      aside: Heading and notes beside the form on wide screens.
      card: The form in a raised card.
    slots:
      heading: {type: text, required: true, max: 140}
      intro: {type: rich, max: 1200}
      mode: {type: choice, required: true, values: [local, mailto, endpoint], note: "local sends nothing; mailto opens the visitor's mail client; endpoint posts to a supplied URL."}
      target: {type: text, max: 300, note: "The supplied email address for mailto, or HTTPS URL for endpoint. Never invent one."}
      fields: {type: fields, required: true, min_items: 1, max_items: 20}
      submit: {type: text, required: true, max: 60, note: "Button label, such as Download brief."}
      note: {type: rich, max: 600, note: "Shown beside the button; state plainly what happens to entered data."}
      download_name: {type: text, max: 60, note: "Local mode file name ending in .txt."}
      fallback: {type: rich, max: 1200, note: "Shown without JavaScript in local mode, such as how to copy the questions by hand."}
  page-header:
    summary: The opening of every interior page. Compact, with a breadcrumb back home, the page title and optional key facts.
    variants:
      plain: Title and lede on the page background.
      split: Title beside one artwork.
      band: Title on a full-width surface band.
      rule: Oversized title set under a heavy rule, for editorial pages.
      centered: Title and lede centered.
      minimal: Title only, small and quiet.
      giant: An enormous title that fills the width.
      ledger: Title and introduction side by side across a rule, facts in ruled cells.
      boxed: The whole opening on a card.
      banner: The picture as a wide low strip above the title.
      stripe: A thick accent bar beside the title block.
      index: An oversized accent label over a compact title.
    slots:
      kicker: {type: text, max: 80, note: "Short label above the title, such as a category."}
      heading: {type: text, required: true, max: 140}
      lede: {type: rich, max: 600}
      meta: {type: items, max_items: 6, note: "Key facts shown as a strip, such as Year, Role or Price.", fields: {label: {type: text, required: true, max: 40}, value: {type: text, required: true, max: 80}}}
      actions: {type: links, max_items: 2}
      art: {type: image, note: "Required by split."}
  lead:
    summary: An opening paragraph set large, optionally with a drop cap, to start long reading.
    variants:
      plain: Large lead text.
      dropcap: Large lead text with a drop cap.
      framed: The opening words between two heavy rules.
      pull: Indented behind an accent bar, in the display face.
      centered: A short centred opening.
    slots:
      body: {type: rich, required: true, max: 1200}
  figure:
    summary: An artwork placed within reading, with a caption.
    variants:
      inline: At reading width.
      wide: Wider than the reading column.
      aside: Beside the text on wide screens.
    slots:
      art: {type: image, required: true}
      caption: {type: text, max: 300}
      credit: {type: text, max: 120, note: "Only a supplied credit."}
  callout:
    summary: A highlighted note, tip or warning inside reading.
    variants:
      note: A quiet side note.
      tip: A helpful tip with the accent color.
      warning: Something the reader must not miss.
    slots:
      heading: {type: text, max: 120}
      body: {type: rich, required: true, max: 1200}
  table:
    summary: Tabular data such as a comparison, specification or schedule of fees. Supplied figures only.
    variants:
      plain: Ruled rows.
      striped: Alternating row shading.
    slots:
      heading: {type: text, max: 140}
      caption: {type: text, required: true, max: 200, note: "Describes what the table shows; read by screen readers."}
      columns: {type: items, min_items: 2, max_items: 6, fields: {label: {type: text, required: true, max: 60}}}
