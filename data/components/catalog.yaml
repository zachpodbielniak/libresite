    variants:
      accent: On the accent color.
      quiet: A bordered line.
      banner: A solid band in the ink colour.
      pill: A centred rounded pill.
      side: An accent bar down the left edge.
      ticket: A dashed tear-off edge.
    slots:
      text: {type: rich, required: true, max: 300}
      link: {type: link}
  locations:
    summary: Several places with their address, hours and a link each.
    variants:
      cards: One card per place.
      list: A list of places.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 1
        max_items: 20
        fields:
          name: {type: text, required: true, max: 80}
          address: {type: rich, required: true, max: 300}
          hours: {type: text, max: 160}
          art: {type: image}
          link: {type: link}
  specs:
    summary: A specification sheet in labeled groups, for products, rooms or projects.
    variants:
      groups: Groups side by side.
      sheet: One long ruled sheet.
    slots:
      heading: {type: text, max: 140}
      groups:
        type: items
        min_items: 1
        max_items: 8
        fields:
          name: {type: text, required: true, max: 60}
          items: {type: items, min_items: 1, max_items: 16, fields: {label: {type: text, required: true, max: 60}, value: {type: text, required: true, max: 160}}}
  directory:
    summary: An A to Z list of entries, grouped by first letter automatically.
    variants:
      columns: Letter groups in columns.
      list: Letter groups one after another.
    slots:
      heading: {type: text, max: 140}
      intro: {type: rich, max: 600}
      items:
        type: items
        min_items: 2
        max_items: 120
        fields:
          title: {type: text, required: true, max: 100}
          note: {type: text, max: 120}
          link: {type: link}
  links:
    summary: Onward links to related pages.
    variants:
      list: A simple list.
      tiles: Large linked tiles.
      inline: Links in a sentence-like row.
      cards: Links as bordered cards.
      numbered: A running number before each link.
      arrows: Big rows with a large arrow at the right.
      columns: Two ruled columns of links.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 1
        max_items: 8
        fields:
          link: {type: link, required: true}
          body: {type: text, max: 200}
  custom:
    summary: An escape hatch for one signature moment the catalog cannot express. Well-formed XHTML using the site's CSS variables; style it through the page css. No scripts, forms, iframes, inline event handlers, style attributes or remote URLs.
    variants:
      contained: Inside the content width.
      bleed: Across the full viewport width.
    slots:
      label: {type: text, required: true, max: 120, note: "Accessible name for the region."}
      html: {type: html, required: true, max: 12000}
  poster:
    summary: A typographic poster opening. The title is the image. Home only.
    variants:
      type: Type alone, set as large as the width allows.
      stamped: The title in a tilted accent block with the lede beside it.
      backdrop: Artwork behind the title, faded into the page.
    slots:
      kicker: {type: text, max: 80}
      heading: {type: text, required: true, max: 80, note: "Short: two to six words set very large."}
      lede: {type: rich, max: 400}
      art: {type: image, note: "Used by backdrop."}
      actions: {type: links, max_items: 2}
  showcase:
    summary: Large feature panels, one per project, service or product, each with artwork and a short pitch.
    variants:
      alternating: Wide panels whose artwork alternates sides.
      overlap: Artwork with a text card overlapping one corner.
      full: Artwork edge to edge with the text beneath, one panel after another.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 1
        max_items: 6
        fields:
          art: {type: image, required: true}
          kicker: {type: text, max: 60}
          title: {type: text, required: true, max: 100}
          body: {type: rich, max: 600}
          link: {type: link}
  big-list:
    summary: An oversized typographic list of links, like a table of contents or an index of work.
    variants:
      plain: Huge titles divided by rules.
      numbered: Each line numbered, with its meta at the right.
      invert: Lines fill with the accent on hover and focus.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 2
        max_items: 20
        fields:
          title: {type: text, required: true, max: 80}
          meta: {type: text, max: 60}
          link: {type: link}
  story:
    summary: A scrolling sequence beside one artwork that stays in view. For a process, a history or how something is made.
    variants:
      left: Artwork held on the left.
      right: Artwork held on the right.
    slots:
      heading: {type: text, max: 140}
      art: {type: image, required: true}
      items:
        type: items
        min_items: 2
        max_items: 8
        fields:
          kicker: {type: text, max: 40}
          title: {type: text, required: true, max: 100}
          body: {type: rich, required: true, max: 800}
  profile:
    summary: One supplied person, such as a founder or the owner, with portrait artwork, role and a few words. Never invent people.
    variants:
      side: Portrait beside the text.
      centered: Portrait above centered text.
      quote: The person's supplied words set large beside a small portrait.
    slots:
      heading: {type: text, max: 140}
      art: {type: image}
      name: {type: text, required: true, max: 80}
      role: {type: text, max: 80}
      body: {type: rich, max: 1200}
      quote: {type: text, max: 300, note: "Only words the person is supplied as saying."}
  badges:
    summary: Supplied credentials, memberships, guarantees or standards. Never invent any.
    variants:
      row: A row of outlined labels.
      seals: Round seals with a label and note.
    slots:
      heading: {type: text, max: 140}
      items:
        type: items
        min_items: 1
        max_items: 12
        fields:
          label: {type: text, required: true, max: 60}
          note: {type: text, max: 120}
  offer:
    summary: One highlighted offer, package or ticket with its supplied price and what it includes.
    variants:
      ticket: A ticket with a perforated stub holding the price.
      card: A bold card with the price large.
    slots:
      kicker: {type: text, max: 60}
      heading: {type: text, required: true, max: 120}
      price: {type: text, max: 40, note: "Only a supplied price."}
      note: {type: text, max: 120, note: "Such as per person or valid until."}
      body: {type: rich, max: 600}
      includes: {type: items, max_items: 10, fields: {text: {type: text, required: true, max: 120}}}
      actions: {type: links, max_items: 2}
# Home compositions (docs/components.org, "Home compositions"). The builder
# deals one per site from its seed: it narrows the home opening to the
# composition's openings, sets the builder look axes it names, orders the
# home sections after the opening by role, and with css: true adds
# home-NAME.css for the home page. avoid lists frames it is never dealt with.
compositions:
  roles:
    offer: [services, cards, bento, features, products, product, pricing, offer, showcase, strip, gallery, carousel, media, big-list, menu, specials, entries, filter, news, jobs, directory, timetable, schedule, recipe]
    process: [steps, timeline, story, checklist, compare, tabs, split]
    proof: [voices, quote, press, partners, badges, numbers, facts, team, profile]
    story: [text, lead, statement, manifesto, figure, columns, callout, marquee, article, glossary, custom, module]
    practical: [faq, hours, location, locations, areas, notice, details, table, specs, jumpnav]
    close: [cta, contact-card, call, form, links, social, share, pager]
  layouts:
    split:
      summary: Split hero. Words beside a picture, then an even run of sections.
      openings: [hero/split, cover/split, hero/overlap, hero/banner]
      order: [offer, process, proof, story, practical]
    full-bleed:
      summary: Full-bleed. The opening picture runs edge to edge and sections run across the whole width.
      openings: [cover/full, hero/banner, poster/backdrop, cover/framed]
      look: {frame: wide}
      order: [story, practical, offer, proof, process]
      css: true
    editorial:
      summary: Editorial column. One narrow reading column under a typographic opening, like a magazine page.
      openings: [poster/type, hero/statement, hero/minimal, manifesto/stacked]
      look: {frame: center}
      order: [story, process, offer, proof, practical]
      css: true
    bento:
      summary: Bento grid. After the opening, sections sit side by side as tiles of a grid on wide screens.
      openings: [hero/centered, hero/split, cover/framed, hero/overlap]
      look: {headpos: top}
      order: [offer, proof, practical, story, process]
      avoid: [center]
      css: true
    oversized-type:
      summary: Oversized type. A poster or manifesto opening and section headings set very large.
      openings: [poster/type, poster/stamped, manifesto/stacked, manifesto/outlined]
      order: [proof, process, practical, offer, story]
      css: true
    side-rail:
      summary: Sticky side rail. A contents column of the home sections stays beside them on wide screens.
      openings: [hero/statement, hero/split, poster/stamped, hero/minimal]
      look: {headpos: top}
      order: [practical, process, offer, proof, story]
      avoid: [rail, split, center]
      sidebar: true
    stacked-cards:
      summary: Stacked cards. Each section after the opening is its own card, stacked down the page.
      openings: [hero/centered, cover/framed, manifesto/numbered, hero/statement]
      order: [offer, practical, process, proof, story]
      avoid: [center]
      css: true
    zigzag:
      summary: Zigzag. Sections step from one side to the other down the page.
      openings: [hero/overlap, cover/split, hero/banner, manifesto/outlined, cover/full]
      look: {headpos: top}
      order: [process, story, offer, proof, practical]
      avoid: [center]
      css: true
# Motion kits (docs/components.org, "Motion"). The builder deals one per
# unthemed site from its seed: kit-NAME.css (and motion-SCRIPT.js when it
# names a script) is added to every page, the body carries kit-NAME, look sets builder
# axes the kit replaces, and marquee: true adds a decorative band of the
# site's name above the footer. Everything moves only for visitors who have
# not asked for reduced motion.
motion_kits:
  kits:
    cascade:
      summary: The opening's lines arrive one after another, list items cascade in as they scroll into view, and buttons fill with a sweep.
      look: {motion: none}
    parallax:
      summary: The opening's picture drifts slower than the page, section headings slide in from the side, and link underlines grow under the pointer.
      look: {motion: none}
    aurora:
      summary: Soft shapes drift slowly behind the opening, which fades up on arrival, and cards float under the pointer.
      look: {motion: none}
    ticker:
      summary: A band of the business's name runs above the footer, figures count up as they come into view, and buttons press in.
      look: {motion: none}
      script: counters
      marquee: true
    spotlight:
      summary: Sections settle into place as they scroll in, figures count up, and cards tilt toward the pointer.
      look: {motion: none}
      script: counters
    still:
      summary: Almost still. Only the opening's heading settles on arrival; links, buttons and focus rings answer with small, crisp movements.
      look: {motion: none}
# Generated palettes (docs/components.org, "Type and colour range"). share
# percent of sites get a palette generated from their seed instead of a
# curated one: a mode (weights in percent), a base hue anywhere on the
# wheel and an accent hue at one of the harmony offsets in degrees, built
# in OKLCH and adjusted until every text pair reaches WCAG AA.
palette_generator:
  share: 80
  modes: {light: 28, dark: 16, tinted: 24, vivid: 16, deep: 16}
  harmonies: {complementary: 180, split-warm: 150, split-cool: 210, triadic: 120, analogous: 35}
# Extra component variants (docs/components.org, "Component variants").
# Each joins its component's variants at load, so plans may name it and the
# builder deals it like any other; its styles are NAME--VARIANT.css, added
# only to sites that render it. They restyle the component's own markup.
extra_variants:
  services:
    ledger: Each service under a heavy rule with a large running number, two to a row.
    tiles: Solid tiles alternating between the surface and the ink, names set large.
  voices:
    stack: The first quote set large under an oversized quotation mark, the rest beside a rule.
    ribbon: Quote cards in one row that scrolls sideways and snaps.
  steps:
    path: Numbered stops on a dashed route down the left.
    chapters: Each step a chapter, its number huge in outline between rules.
  faq:
    chat: Questions as speech bubbles, answers replying from the other side.
    index: Questions as a grid of short cards opened by an accent bar.
  cta:
    stripe: The call in a box framed by diagonal accent stripes.
    note: The call on a pinned, slightly turned note with tape.
  contact-card:
    ticket: The details on a ticket with notched sides and a dashed tear line.
    postcard: A postcard, words on the left and the details on ruled lines on the right.
  gallery:
    polaroid: Prints in thick paper frames, each turned a little.
    filmstrip: Pictures in one dark band that scrolls sideways, edged with sprocket holes.
# Art directions (docs/components.org, "Art direction"). The builder deals
# one per unthemed site: look picks the drawing style and image treatment
# from its lists, brief goes to the artist with every artwork, and
# art-NAME.css styles the drawn artwork (never photographs or the mark).
art_directions:
  directions:
    duotone:
      summary: Drawn artwork shown in two tones, the accent for its darks and white for its lights.
      look: {art: [flat, woodcut, neon], images: [plain, rounded, shadow]}
      brief: The site shows every artwork in two tones, the accent for darks and white for lights. Draw a few large shapes with strong light and dark contrast so it reads well in two colours; avoid fine detail and gradients.
    cutout:
      summary: Drawn artwork cut into arches, slants and rounded shapes over an accent block.
      look: {art: [cutpaper, flat], images: [plain, shadow, blob]}
      brief: The site cuts each artwork into an arch, a slant or a rounded shape. Keep the subject centred with generous margin so the cut never crops it, and fill the whole canvas with background colour.
    framed:
      summary: Drawn artwork hung in frames with a mat, like prints on a wall.
      look: {art: [woodcut, line, open, blueprint], images: [framed, print]}
      brief: The site hangs each artwork in a frame with a mat. Compose it as a finished print, centred, with an even border of open space inside the edge.
    collage:
      summary: Drawn artwork pinned up like a collage, turned, taped and layered over scraps.
      look: {art: [cutpaper, open, flat], images: [taped, print, tilt]}
      brief: The site pins each artwork up like a collage, turned and taped over a paper scrap. Draw separate layered pieces with a cut-paper feel and visible edges.
    lineart:
      summary: Drawn artwork as line drawings inside a fine offset outline with corner marks.
      look: {art: [line, blueprint], images: [plain, rounded, framed]}
      brief: The site shows each artwork as a line drawing inside a fine outline. Use single-weight lines on an open background, with at most one accent fill.
# Content angles (docs/components.org, "Content angles"). The builder deals
# each unthemed or themed site one headline angle for its home page and one
# subject for its artwork, from its seed; the plan, page and art writers are
# told them. The words and drawings stay the model's.
content_angles:
  headlines:
    promise: Lead with the one result the customer gets, in their own words, not a slogan.
    problem: Name the trouble the customer has right now and say that it ends here.
    place: Ground it in the kind of homes, yards or seasons the business works in, without inventing a place name.
    craft: Show how the work is done, one specific technique or habit of the crew.
    time: Lead with when, how quickly, how long it lasts or the season it is for, without promising a time that was not supplied.
    question: Ask the question the customer is asking themselves, and answer it in the lede.
    plain: Say exactly what the business does, in plain short words, no adjectives.
    character: Let the business's personality speak, as its owner would say it across a kitchen table.
  subjects:
    tool: The trade's most characteristic tool, drawn close up.
    material: The material the work is made of, as a texture or a close detail.
    detail: One telling detail of the finished work, close up, never the whole house.
    process: A moment of the work in progress, with hands and tools but no faces.
    result: The finished result as the customer sees it from inside their home or yard.
    pattern: A repeating pattern built from the trade's own shapes.
    setting: The setting at a time of day, such as a yard at dusk or a room in morning light.
    diagram: A clear cutaway or diagram of how the system works.
# Section forms and extras (docs/components.org, "Section forms and
# extras"). Each site is dealt one form per family; a section of that
# family takes the form, its heading, intro and items carried over by the
# field names below (title and body, in the slot named by list, items by
# default; link where both have it). The close family is a page's last
# section, a closing call (call: true): its heading, words and links move
# between a call to action, a statement and a list of links. extras are
# home sections the builder builds only from the site's own words; share
# percent of sites get one, picked from the list.
section_forms:
  families:
    offer: [services, cards, bento, entries, big-list]
    process: [steps, features, tabs, columns]
    practical: [faq, details, glossary]
    close: [cta, statement, links]
  fields:
    services: {title: name, body: summary}
    cards: {title: title, body: body}
    bento: {list: tiles, title: title, body: body}
    big-list: {title: title, body: meta}
    features: {title: title, body: body}
    entries: {title: title, body: summary}
    steps: {title: title, body: body}
    tabs: {title: label, body: body}
    columns: {title: heading, body: body}
    faq: {title: question, body: answer}
    details: {title: title, body: body}
    glossary: {title: term, body: definition}
    cta: {call: true}
    statement: {call: true}
    links: {call: true}
  extras: [marquee, statement, links, big-list]
  share: 90
# Extra look values (docs/components.org, "Section forms and extras"). Each
# joins its axis at load and is dealt like the others; its styles are
# look-AXIS-VALUE.css, added only to sites that wear it.
extra_looks:
  align:
    right: Headings and intros set to the right where the column has room.
    stagger: Every other section sets its heading and intro to the right where the column has room.
  nav:
    boxed: Each link in a hairline box, the current page filled.
    dots: A small accent dot between links.
    bold: Heavy, slightly larger links.
    bar: An accent bar over the current page.
  footer:
    accent: The footer painted in the accent.
    centered: Everything in the footer in one centred column.
    ruled: A heavy rule over the footer and its name set large.
  rhythm:
    airy: Sections stand apart with extra air between them.
  heads:
    underline: Section headings underlined in the accent.
    dash: A short accent dash leads each section heading.
    boxed: Section headings set in a block of ink.
  buttons:
    soft: Tinted, rounded buttons with accent text.
    block: Square, heavy, spaced capitals.
    arrow: A trailing arrow on every button.
  panels:
    paper: Soft paper cards with a hairline edge and a low shadow.
    stack: Cards with two offset layers behind them.
    dashed: Cards drawn with a dashed edge.
  header:
    underlined: A thick accent rule under the header.
    roomy: A taller header with a larger name.
  lettering:
    wide: The page headline in widely spaced capitals.
    italic: The page headline set in italic.
  images:
    blob: Pictures in a soft organic shape.
    tilt: Pictures turned slightly, one way then the other.
# Wider option pools (docs/components.org, "Sameness under a tenth"). Each
# list joins the block it names when the library loads and is dealt like
# the rest: looks join their axes (look-AXIS-VALUE.css), openings join a
# home opening component (COMPONENT--VARIANT.css, dealt through the
# compositions that list it), layouts the home compositions, kits the
# motion kits, directions the art directions, and forms the section form
# families, with their fields.
wider:
  forms:
    offer: [directory]
    process: [split]
    practical: [facts]
  fields:
    directory: {title: title, body: note}
    split: {list: panels, title: heading, body: body}
    facts: {title: label, body: value}
