<div class="wrap">
{{#heading}}<div class="section-head"><{{htag}} id="{{id}}-h">{{heading}}</{{htag}}></div>
{{/heading}}<div class="compare__pair">
{{#first}}<figure class="compare__side">{{#art}}<img src="{{src}}" alt="{{alt}}" width="{{width}}" height="{{height}}" loading="lazy" decoding="async">{{/art}}<figcaption class="kicker">{{label}}</figcaption></figure>
{{/first}}{{#second}}<figure class="compare__side">{{#art}}<img src="{{src}}" alt="{{alt}}" width="{{width}}" height="{{height}}" loading="lazy" decoding="async">{{/art}}<figcaption class="kicker">{{label}}</figcaption></figure>
{{/second}}</div>
{{#caption}}<p class="compare__caption muted">{{caption}}</p>
{{/caption}}</div>
