<div class="wrap">
{{#heading}}<div class="section-head"><{{htag}} id="{{id}}-h">{{{heading_html}}}</{{htag}}></div>
{{/heading}}<ul class="gallery__featured" role="list">
{{#items}}<li><figure>{{#art}}{{#lightbox}}<a class="gallery__zoom" href="{{src}}" data-lightbox>{{/lightbox}}<img src="{{src}}" alt="{{alt}}" width="{{width}}" height="{{height}}"{{#srcset}} srcset="{{srcset}}" sizes="(max-width: 48rem) 100vw, 33vw"{{/srcset}} loading="lazy" decoding="async">{{#lightbox}}</a>{{/lightbox}}{{/art}}
{{#caption}}<figcaption>{{caption}}</figcaption>{{/caption}}</figure></li>
{{/items}}</ul>
</div>
