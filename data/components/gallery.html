<div class="wrap">
{{#heading}}<div class="section-head"><{{htag}} id="{{id}}-h">{{{heading_html}}}</{{htag}}></div>
{{/heading}}<ul class="gallery__list" role="list" data-lightbox>
{{#items}}<li><figure class="gallery__item">{{#art}}<a class="gallery__open" href="{{src}}"><img src="{{src}}" alt="{{alt}}" width="{{width}}" height="{{height}}"{{#srcset}} srcset="{{srcset}}" sizes="(max-width: 40rem) 100vw, (max-width: 64rem) 50vw, 33vw"{{/srcset}} loading="lazy" decoding="async"></a>{{/art}}{{#caption}}<figcaption class="muted">{{caption}}</figcaption>{{/caption}}</figure></li>
{{/items}}</ul>
<dialog class="gallery__dialog"><form method="dialog"><button class="gallery__close" type="submit">{{close_label}}</button></form><img alt=""><p class="gallery__caption"></p></dialog>
</div>
