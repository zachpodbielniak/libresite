<div class="wrap">
{{#heading}}<div class="section-head"><{{htag}} id="{{id}}-h">{{heading}}</{{htag}}></div>
{{/heading}}<ul class="gallery__list" role="list">
{{#items}}<li><figure class="gallery__item">{{#art}}<img src="{{src}}" alt="{{alt}}" width="{{width}}" height="{{height}}" loading="lazy" decoding="async">{{/art}}{{#caption}}<figcaption class="muted">{{caption}}</figcaption>{{/caption}}</figure></li>
{{/items}}</ul>
</div>
