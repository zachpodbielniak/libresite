# SPDX-License-Identifier: AGPL-3.0-or-later
# Site identities. The builder deals each site a palette, a type pairing and a
# home-page sequence that suit its sector, varied by the site's name and brief,
# so sites start from designs that fit the business instead of one house
# default. The plan adapts them. Palettes are contrast-checked and typefaces
# checked like plans at load; see docs/components.org.
version: 1
sectors:
  trades: Plumbing, building, repair and other hands-on services.
  food: Restaurants, cafes, bakeries, bars and food makers.
  community: Nonprofits, clubs, schools and civic groups.
  advisory: Consultants, lawyers, accountants and other advisers.
  software: Software products, developer tools and apps.
  creative: Studios, designers, artists and makers.
  retail: Shops, stalls and product brands.
  wellness: Health, fitness, therapy and care.
