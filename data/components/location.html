<div class="wrap location__inner">
<div class="location__text">
{{#heading}}<{{htag}} id="{{id}}-h">{{{heading_html}}}</{{htag}}>
{{/heading}}<address class="location__address">{{{address}}}</address>
{{#directions}}<div class="location__directions prose">{{{directions}}}</div>
{{/directions}}{{#has_actions}}<p class="actions">{{#actions}}<a class="button{{^primary}} button--ghost{{/primary}}" href="{{href}}"{{#external}} rel="noopener"{{/external}}>{{label}}</a>{{/actions}}</p>
{{/has_actions}}</div>
{{#art}}<figure class="location__map"><img src="{{src}}" alt="{{alt}}" width="{{width}}" height="{{height}}" loading="lazy" decoding="async"></figure>
{{/art}}</div>
