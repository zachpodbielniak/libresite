<div class="wrap">
{{#heading}}<{{htag}} class="manifesto__title kicker" id="{{id}}-h">{{heading}}</{{htag}}>
{{/heading}}<ol class="manifesto__lines" role="list">
{{#lines}}<li class="manifesto__line"><span class="manifesto__n" aria-hidden="true">{{n2}}</span><span class="manifesto__text">{{text}}</span></li>
{{/lines}}</ol>
{{#has_actions}}<p class="actions">{{#actions}}<a class="button{{^primary}} button--ghost{{/primary}}" href="{{href}}"{{#external}} rel="noopener"{{/external}}>{{label}}</a>{{/actions}}</p>
{{/has_actions}}</div>
