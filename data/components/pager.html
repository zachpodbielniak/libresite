<div class="wrap">
<nav class="pager__nav" aria-label="{{pager_label}}">
{{#previous}}<a class="pager__link pager__link--previous" href="{{href}}"{{#external}} rel="noopener"{{/external}}><span class="pager__dir">{{previous_label}}</span><span class="pager__title">{{label}}</span></a>
{{/previous}}{{#next}}<a class="pager__link pager__link--next" href="{{href}}"{{#external}} rel="noopener"{{/external}}><span class="pager__dir">{{next_label}}</span><span class="pager__title">{{label}}</span></a>
{{/next}}</nav>
</div>
