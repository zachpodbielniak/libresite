<div class="form__sent" role="status" aria-live="polite" tabindex="-1" data-form-sent hidden>
<p class="form__sent-message">{{sent}}</p>
<p class="form__sent-actions">{{#sent_call}}<a class="button form__sent-call" href="{{tel}}">{{call_label}} <span class="form__sent-number">{{phone}}</span></a>
{{/sent_call}}<a class="form__sent-again" href="#{{form_id}}" data-form-again>{{send_another_label}}</a></p>
</div>
<form class="form__form quote-form" id="{{form_id}}" aria-labelledby="{{labelledby}}" action="{{target}}" method="post" data-endpoint-form data-sending="{{sending}}" data-failed="{{send_failed}}" data-error-invalid="{{error_invalid}}"{{#multipart}} enctype="multipart/form-data"{{/multipart}} data-validate data-error-required="{{error_required}}" data-error-summary="{{error_summary}}">
{{{fields_html}}}{{#honeypot}}<div class="form__trap" aria-hidden="true" inert><label>Leave this field empty <input type="text" name="{{honeypot}}" tabindex="-1" autocomplete="off"></label></div>
{{/honeypot}}<div class="form__summary" role="alert" data-form-summary hidden></div>
<div class="form__actions">
<button class="button{{#quiet}} button--outline{{/quiet}}" type="submit">{{submit}}</button>
</div>
<p class="form__status" role="status" data-form-status></p>
</form>
