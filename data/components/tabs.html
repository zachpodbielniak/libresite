<div class="wrap" data-tabs>
{{#heading}}<div class="section-head"><{{htag}} id="{{id}}-h">{{{heading_html}}}</{{htag}}></div>
{{/heading}}<div class="tabs__list" role="tablist" hidden>
{{#items}}<button class="tabs__tab" type="button" role="tab" id="{{id}}-tab-{{n}}" aria-controls="{{id}}-panel-{{n}}" aria-selected="false" tabindex="-1">{{label}}</button>
{{/items}}</div>
{{#items}}<div class="tabs__panel" id="{{id}}-panel-{{n}}" role="region" aria-labelledby="{{id}}-label-{{n}}">
<{{subtag}} class="tabs__label" id="{{id}}-label-{{n}}">{{label}}</{{subtag}}>
<div class="prose">{{{body}}}</div>
</div>
{{/items}}</div>
