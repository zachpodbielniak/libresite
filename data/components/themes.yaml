      paper: '#f8f5ee'
      ink: '#141414'
      muted: '#555149'
      surface: '#efe9dd'
      line: '#d9d1c2'
      accent: '#141414'
      accent_ink: '#f8f5ee'
      font_display: '"Cormorant Garamond", Georgia, serif'
      font_body: '"Jost", system-ui, sans-serif'
