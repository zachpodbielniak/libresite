      font_display: '"Nunito", system-ui, sans-serif'
      font_body: '"Nunito Sans", system-ui, sans-serif'
      font_mono: ui-monospace, monospace
      base_size: 1.0625
      ratio: 1.22
      measure: 66
      radius: 18
      border: 1
      space: 1.1
      density: airy
      heading_weight: 800
      heading_tracking: -0.015
      heading_leading: 1.1
      heading_case: none
    fonts:
    - family: Nunito
      weights:
      - 700
      - 800
    - family: Nunito Sans
      weights:
      - 400
      - 600
    look:
      header: floating
      nav: pill
      heads: plain
      buttons: pill
      panels: raised
      rhythm: bands
      align: center
      images: rounded
      footer: simple
      texture: none
      motion: rise
    css: '.site-footer { border-radius: 2rem 2rem 0 0; }'
  civic:
    summary: 'Clear and trustworthy: white, institutional blue, plain sans type, outlined panels and an ink footer.'
