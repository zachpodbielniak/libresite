# SPDX-License-Identifier: AGPL-3.0-or-later
# Site themes. A theme is a complete design applied to the whole site: tokens,
# fonts, one value per look axis and signature CSS. Applying one replaces those
# parts of a plan, so every component on every page changes together. Each
# theme is checked like a plan at load; see docs/components.org.
version: 1
themes:
  editorial:
    summary: 'A printed magazine: warm paper, a high-contrast serif, ruled sections and a big footer wordmark.'
    tokens:
      paper: '#f6f1e7'
      ink: '#1d1a16'
      muted: '#5c554b'
      surface: '#ece4d4'
      line: '#d6ccb9'
      accent: '#9e2a1e'
      accent_ink: '#ffffff'
      font_display: '"Fraunces", Georgia, serif'
      font_body: '"Source Serif 4", Georgia, serif'
      font_mono: '"IBM Plex Mono", ui-monospace, monospace'
      base_size: 1.0625
      ratio: 1.3
      measure: 66
      radius: 0
      border: 1
      space: 1
      density: regular
      heading_weight: 600
      heading_tracking: -0.025
      heading_leading: 1.02
      heading_case: none
    fonts:
    - family: Fraunces
      weights:
      - 400
      - 600
      - 800
      italic: true
    - family: Source Serif 4
      weights:
      - 400
      - 600
      italic: true
    - family: IBM Plex Mono
      weights:
      - 400
      - 500
    look:
      header: stacked
      nav: caps
      heads: rule
      buttons: underline
      panels: rules
      rhythm: divided
      align: left
      images: plain
      footer: big
      texture: grain
      motion: none
    css: '.hero__title, .page-header__title { font-variation-settings: ''opsz'' 144; } .lede { font-style: italic; }'
  brutalist:
    summary: 'Raw and loud: white, black, electric yellow, square edges, hard shadows and a drafting grid.'
    tokens:
      paper: '#ffffff'
      ink: '#0a0a0a'
      muted: '#474747'
      surface: '#f1f1ec'
      line: '#0a0a0a'
      accent: '#ffe600'
      accent_ink: '#0a0a0a'
      font_display: '"Space Grotesk", system-ui, sans-serif'
      font_body: '"Space Grotesk", system-ui, sans-serif'
      font_mono: '"JetBrains Mono", ui-monospace, monospace'
      base_size: 1.0625
      ratio: 1.33
      measure: 66
      radius: 0
      border: 2
      space: 1
      density: regular
      heading_weight: 700
      heading_tracking: -0.04
      heading_leading: 0.95
      heading_case: uppercase
    fonts:
    - family: Space Grotesk
      weights:
      - 400
      - 500
      - 700
    - family: JetBrains Mono
      weights:
      - 400
      - 700
    look:
      header: bar
      nav: slashes
      heads: numbered
      buttons: offset
      panels: outlined
      rhythm: divided
      align: left
      images: framed
      footer: inverted
      texture: grid
      motion: none
    css: '.site-header { border-bottom-width: 3px; border-bottom-color: var(--ink); } a:hover { background: var(--accent); color: var(--accent-ink); } ::selection { background: var(--ink); color: var(--accent);
      }'
  midnight:
    summary: 'After dark: deep navy, warm amber, large confident type, dotted texture and banded sections.'
    tokens:
      paper: '#0e1422'
      ink: '#eef1f7'
      muted: '#a9b3c7'
      surface: '#172036'
      line: '#2b3652'
      accent: '#f4b642'
      accent_ink: '#1a1204'
      font_display: '"Bricolage Grotesque", system-ui, sans-serif'
      font_body: '"Inter", system-ui, sans-serif'
      font_mono: '"JetBrains Mono", ui-monospace, monospace'
      base_size: 1.0625
      ratio: 1.3
      measure: 66
      radius: 10
      border: 1
      space: 1
      density: regular
      heading_weight: 700
      heading_tracking: -0.03
      heading_leading: 1.0
      heading_case: none
    fonts:
    - family: Bricolage Grotesque
      weights:
      - 400
      - 700
      - 800
    - family: Inter
      weights:
      - 400
      - 500
      - 600
    - family: JetBrains Mono
      weights:
      - 400
    look:
      header: floating
      nav: pill
      heads: giant
      buttons: pill
      panels: flat
      rhythm: bands
      align: left
      images: rounded
      footer: simple
      texture: dots
      motion: rise
    css: '.hero__title, .poster__title { color: var(--accent); } .kicker { color: var(--accent); }'
  soft:
    summary: 'Friendly and calm: cream, sage, rounded everything, soft shadows and centered headings.'
