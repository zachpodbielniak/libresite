      radius: 2
      border: 2
      space: 1
      density: regular
      heading_weight: 800
      heading_tracking: -0.025
      heading_leading: 1.0
      heading_case: none
    fonts:
    - family: Archivo
      weights:
      - 600
      - 800
    - family: Source Serif 4
      weights:
      - 400
      - 600
    - family: JetBrains Mono
      weights:
