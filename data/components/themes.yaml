# SPDX-License-Identifier: AGPL-3.0-or-later
# Site themes. A theme is a complete design applied to the whole site: tokens,
# fonts, one value per look axis and signature CSS. Applying one replaces those
# parts of a plan, so every component on every page changes together. Each
# theme is checked like a plan at load; see docs/components.org.
version: 1
themes:
  editorial:
    summary: 'A printed magazine: warm paper, a high-contrast serif, ruled sections and a big footer wordmark.'
    tokens:
      paper: '#f6f1e7'
      ink: '#1d1a16'
      muted: '#5c554b'
      surface: '#ece4d4'
      line: '#d6ccb9'
      accent: '#9e2a1e'
      accent_ink: '#ffffff'
      font_display: '"Fraunces", Georgia, serif'
      font_body: '"Source Serif 4", Georgia, serif'
      font_mono: '"IBM Plex Mono", ui-monospace, monospace'
      base_size: 1.0625
      ratio: 1.3
      measure: 66
      radius: 0
      border: 1
      space: 1
      density: regular
      heading_weight: 600
      heading_tracking: -0.025
      heading_leading: 1.02
      heading_case: none
    fonts:
    - family: Fraunces
      weights:
      - 400
      - 600
      - 800
      italic: true
    - family: Source Serif 4
      weights:
      - 400
      - 600
      italic: true
    - family: IBM Plex Mono
      weights:
      - 400
      - 500
    look:
      header: stacked
      nav: caps
      heads: rule
      buttons: underline
      panels: rules
      rhythm: divided
      align: left
      images: plain
      footer: big
      texture: grain
      motion: none
      emphasis: italic
      ornament: rule
      kicker: line
      backdrop: none
      art: line
      photos: natural
      edges: straight
      lettering: dropcap
      links: underline
      scheme: fixed
    css: '.hero__title, .page-header__title { font-variation-settings: ''opsz'' 144; } .lede { font-style: italic; }'
