      font_mono: '"IBM Plex Mono", ui-monospace, monospace'
      base_size: 1.0625
      ratio: 1.2
      measure: 70
      radius: 4
      border: 1
      space: 1
      density: regular
      heading_weight: 600
      heading_tracking: -0.01
      heading_leading: 1.15
      heading_case: none
    fonts:
    - family: IBM Plex Sans
      weights:
      - 400
      - 600
      - 700
    - family: IBM Plex Mono
      weights:
      - 400
    look:
      header: bar
      nav: underline
      heads: bar
      buttons: square
      panels: outlined
      rhythm: even
      align: left
      images: plain
      footer: inverted
      texture: none
      motion: none
    css: '.site-header { border-top: 0.35rem solid var(--accent); }'
  atelier:
    summary: 'Quiet luxury: ivory and black, a spaced capital serif, centered headings, framed art and wide air.'
