<div class="wrap">
{{#heading}}<div class="section-head"><{{htag}} id="{{id}}-h">{{heading}}</{{htag}}></div>
{{/heading}}<ul class="voices__list" role="list">
{{#items}}<li><figure class="voices__item"><blockquote><p>{{quote}}</p></blockquote><figcaption><span class="voices__name">{{name}}</span>{{#role}}<span class="voices__role muted">{{role}}</span>{{/role}}</figcaption></figure></li>
{{/items}}</ul>
</div>
