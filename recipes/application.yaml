version: 1
name: reading-room
package:
  sku: application
  release: '1.0.0'
  kind: application
site:
  pages:
    - path: /
      title: Reading Room
      purpose: List and filter entries, add an entry, mark finished and delete with confirmation.
    - path: /help
      title: Help and data ownership
      purpose: Explain the complete reading workflow, local storage, configuration and backup limitations.
    - path: /404
      title: Page not found
      purpose: Return status 404 for unknown routes with a link to the reading list.
  brief: >-
    Build Reading Room, a local-first reading-list web application. Users can add a title and URL, filter unread versus finished entries, mark an entry finished and delete an entry with confirmation. Persist entries across restarts. Bind to loopback by default; this is a single-user local application with no cloud accounts. Implement a complete vertical slice and tests, not a dashboard mockup.
  audience: A single reader curating a small personal reading list.
  style: application
  stack: c-glib
  frontend: Server-rendered semantic HTML and native CSS via htmx-glib; locally served HTMX enhances forms and filtering, with ordinary form POST/redirect fallbacks when JavaScript is disabled.
  backend: GNU89 C with GCC, GLib/GObject/GIO, htmx-glib routing and yaml-glib runtime configuration. Use config.mk, rules.mk and Makefile with pinned GitLab dependency bootstrap.
  database: orm-glib with persistent SQLite out of the box; one entries table with id, title, url, finished and created_at. Support optional PostgreSQL and MySQL/MariaDB providers with matching bootstrap SQL.
  requirements: >-
    This is application SKU 1.0.0 with fixed pages /, /help and the 404 handler; record their source-to-route mapping in docs/acceptance.org. The list/add/filter/finish/delete workflow is the sold vertical slice. No accounts, multi-tenancy, billing or hosted SaaS operations are included. The application SKU always uses c-glib plus htmx-glib and orm-glib; a different stack requires a plugin or another generator and a separate scope agreement.
    Validate http/https URLs and field lengths, escape HTML, implement CSRF protection for both ordinary and HTMX form posts, bind 127.0.0.1, accept Host and Origin for both 127.0.0.1 and localhost on the listening port. Load config/application.yaml with yaml-glib via GOptionContext --config, resolve database paths relative to that file, create the SQLite file and schema on first start, and preserve data on restart. Include --help/--license, AGPLv3, zero compiler warnings, GTest make tests, org documentation and AGENTS.md. Follow the c-glib stack contract for dependency setup, configuration validation, optional provider switches and dialect-specific bootstrap SQL. Document Fedora build packages and exact local run command. Do not 403 ordinary browser POSTs from http://localhost:PORT/ or http://127.0.0.1:PORT/. No external services are required for the default SQLite configuration.
ai:
  provider: codex
  timeout: 0
  retries: 1
  max_tokens: 0
pipeline:
  steps:
    - id: brief
      type: brief
    - id: design
      type: design
    - id: database
      type: database
    - id: backend
      type: backend
    - id: frontend
      type: frontend
    - id: review
      type: review
    - id: acceptance
      type: validate
      options:
        required:
          - Makefile
          - config.mk
          - rules.mk
          - README.org
          - AGENTS.md
          - deps/manifest.yaml
          - scripts/bootstrap-deps.sh
          - config/application.yaml
          - src/main.c
          - src/app-config.c
          - src/app-config.h
          - src/pages.c
          - src/database.c
          - src/database.h
          - sql/bootstrap-sqlite.sql
          - sql/bootstrap-postgresql.sql
          - sql/bootstrap-mysql.sql
          - tests/test-config.c
          - tests/test-database.c
          - tests/http.sh
          - docs/configuration.org
          - docs/database.org
          - docs/product.org
          - docs/design.org
          - docs/review.org
          - config/seo.yaml
          - docs/seo.org
          - tests/seo.sh
          - tests/check.sh
          - tests/accessibility.sh
          - docs/acceptance.org
        checks:
          - path: Makefile
            contains: ['tests:']
          - path: config.mk
            contains: ['-std=gnu89']
          - path: deps/manifest.yaml
            contains: ['htmx-glib', 'orm-glib', 'yaml-glib']
          - path: config/application.yaml
            contains: ['127.0.0.1', 'sqlite']
          - path: tests/http.sh
            contains: ['localhost', '127.0.0.1']
          - path: docs/acceptance.org
            contains: ['#+title:', '360', '768', '1440']
