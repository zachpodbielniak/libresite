# SPDX-License-Identifier: AGPL-3.0-or-later
version: 1
name: checked-studio
site:
  brief: >-
    Build a restrained editorial landing page for an independent software studio.
    Explain its services and working process without invented testimonials,
    client names, metrics or contact details. Let visitors explore the services
    through an in-page navigation link. Use original local SVG artwork.
  audience: Technical founders evaluating a small independent studio
  style: editorial
  frontend: Semantic HTML and CSS with no preview build step or remote dependencies; a local SEO preparation command produces the production directory.
  requirements: >-
    Provide keyboard navigation, visible focus, reduced-motion support and
    responsive layouts. Use lang="en" and name="viewport" in index.html.
ai:
  provider: codex
  timeout: 0
  max_tokens: 0
  retries: 2
pipeline:
  steps:
    - id: scaffold
      type: scaffold
      options: {profile: static}
    - {id: brief, type: brief}
    - {id: design, type: design}
    - id: design-gate
      type: gate
      options:
        message: Review docs/product.org and docs/design.org before implementing the frontend.
        review: [docs/product.org, docs/design.org]
    - {id: frontend, type: frontend}
    - {id: review, type: review}
    - id: acceptance
      type: validate
      options:
        required: [index.html, 404.html, styles.css, privacy.html, terms.html, robots.txt]
        checks:
          - path: index.html
            contains: ['lang="en"', 'name="viewport"', '<main', '</html>', '<title>', 'name="description"', 'property="og:title"', 'name="twitter:card"', 'noindex']
            excludes: ['TODO', 'Lorem ipsum']
            min_bytes: 512
            max_bytes: 131072
          - path: styles.css
            contains: [':focus-visible', 'prefers-reduced-motion']
            min_bytes: 128
            max_bytes: 131072
    # Build notes guide later steps; the delivered site does not include them.
    - id: build-notes
      type: prune
      options:
        paths: [docs/product.org, docs/design.org, docs/polish.org, docs/review.org]
