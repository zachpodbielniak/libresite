# Default studio SKU; identical scope to studio.yaml, not a reduced landing demo.
# One plan call, a design gate, then every page and artwork written at once and
# composed from the component library (docs/components.org).
# Each AI step can override ai.provider, ai.model and ai.effort.
version: 1
name: fieldwork-studio
package:
  sku: studio
  release: '2.0.0'
  kind: site
site:
  brief: >-
    Create FIELDWORK, an illustrative independent open-source systems and interface studio. Build a complete, distinctive eight-page editorial website. The central idea is "Make the complex feel clear": show how careful engineering and visual communication turn difficult systems into understandable tools. Let visitors explore two substantive concept case studies, understand the approach, read an opinionated journal article and prepare a downloadable project brief. FIELDWORK and its projects are fictional demonstrations; disclose this in the shared footer and on the case studies. Do not invent clients, employees, testimonials, awards, business metrics, contact addresses or live services.
  audience: Technical founders, independent maintainers and design-minded engineers who value ownership, clarity and enduring software.
  style: editorial
  frontend: Static pages from the Libresite component library with original local SVG artwork. No framework, package manager, CDN or external font request.
  backend: none
  database: none
  requirements: >-
    Seven planned routes: index.html, work.html, work-atlas.html, work-common.html, approach.html, journal.html, start.html (404, privacy and terms are built in). Use warm paper, near-black ink and a decisive vermilion accent with accessible text/surface pairs; pair a confident system sans display with a readable system serif for longform and monospace for technical annotations. Create a recognizable original contour/grid illustration language: a large cartographic composition for Atlas and a contrasting modular archive composition for Common. No fake screenshots. Combine a bold typographic opening, full-width art, asymmetric project rows and quiet editorial reading; no repeated generic card grid. No tracking, remote services, signup or pretend form submission.
ai:
  provider: claude-code
  timeout: 0
  retries: 2
  max_tokens: 0
pipeline:
  steps:
    - id: plan
      type: plan
      instructions: >-
        Home introduces the thesis "Make the complex feel clear", shows both projects as asymmetric rows, a short approach passage, a journal excerpt linking to journal.html and a clear next action; its opening is a confident typographic statement with the actions "Explore the work" (work.html) and "Prepare a brief" (start.html). Work indexes both projects with a filter: All, Tools and Culture; Atlas is Tools, Common is Culture. Atlas is a concept offline field-notes tool (information hierarchy, disconnected use, legible field conditions; never claimed as shipped). Common is a concept community archive (discovery, metadata, contributor clarity; no real dataset or service). Each case study needs roughly 300 words covering problem, constraints, decisions, tradeoff and proposed next validation, an explicit concept-project label, related-work links and a link to start.html. Approach explains discover, map, build and maintain through concrete deliverables, collaboration boundaries and maintenance handoff. Journal is a complete essay of roughly 500 words, "Clarity is a systems property", with three practical examples and in-page contents. Start is a local worksheet that sends nothing. Plan art: a cartographic Atlas piece, a modular Common piece and a mark.
    - id: design-gate
      type: gate
      options:
        message: >-
          Review the site plan (design tokens, fonts, navigation, art briefs and page outlines) before the pages are written.
          Resume with --approve design-gate when the direction is accepted.
        review: [site/plan.json]
    - id: pages
      type: pages
      options: {parallel: 12}
      instructions: >-
        Write final copy at the planned depth. The start page uses a local form with fields project name (required, up to 120 characters), problem (required textarea, up to 2000 characters), audience, type (select: site, tool or archive), scope and constraints; no email or personal data; the download file is fieldwork-brief.txt; its note reads exactly "Nothing is sent. Your brief stays in this page until you download it." and its fallback explains copying the questions by hand. Case studies label themselves as concept projects.
    - id: acceptance
      type: validate
      options:
        required: [index.html, work.html, work-atlas.html, work-common.html, approach.html, journal.html, start.html, 404.html, privacy.html, terms.html, styles.css, site.js, robots.txt]
        checks:
          - path: index.html
            contains: ['<main', 'href="work.html"', 'href="start.html"']
          - path: work.html
            contains: ['<main', 'href="work-atlas.html"', 'href="work-common.html"']
          - path: work-atlas.html
            contains: ['<main', 'href="start.html"']
          - path: work-common.html
            contains: ['<main', 'href="start.html"']
          - path: approach.html
            contains: ['<main']
          - path: journal.html
            contains: ['<main']
          - path: start.html
            contains: ['<main', 'Nothing is sent. Your brief stays in this page until you download it.']
          - path: 404.html
            contains: ['<main', 'href="index.html"']
          - path: privacy.html
            contains: ['<main', 'noindex']
          - path: terms.html
            contains: ['<main', 'noindex']
    - id: build-notes
      type: prune
      options: {prefixes: [site/]}
