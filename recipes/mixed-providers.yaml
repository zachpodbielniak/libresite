# Uses provider defaults unless a model is explicitly selected per step.
version: 1
name: field-notes
site:
  brief: A static editorial portfolio for an open-source systems developer, with working in-page project navigation and no invented credentials.
  style: minimalist
  frontend: Semantic HTML and CSS with local SVG assets.
ai:
  provider: codex
  timeout: 0
  max_tokens: 0
  retries: 1
pipeline:
  steps:
    - id: scaffold
      type: scaffold
      options: {profile: static}
    - id: brief
      type: brief
      ai:
        provider: claude-code
        model: sonnet
    - id: design
      type: design
      ai:
        provider: cursor
    - id: design-gate
      type: gate
      options:
        message: Review docs/product.org and docs/design.org before implementing the frontend.
        review: [docs/product.org, docs/design.org]
    - id: implementation
      type: frontend
      ai:
        provider: codex
        model: gpt-6-astra
    - id: refine
      type: generate
      instructions: Refine typography and spacing while preserving all existing functionality.
      ai:
        provider: grok-build
    - id: review
      type: review
      ai:
        provider: antigravity
    - id: acceptance
      type: validate
      options:
        required: [index.html, 404.html, styles.css, README.org, AGENTS.md, Makefile, privacy.html, terms.html, docs/contact.org, tests/scaffold.sh, config/seo.yaml, docs/seo.org, tests/seo.sh, robots.txt, scripts/prepare-seo.sh]
