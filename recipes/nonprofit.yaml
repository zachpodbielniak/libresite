# SPDX-License-Identifier: AGPL-3.0-or-later
version: 1
name: nonprofit-site
package:
  sku: nonprofit
  release: '1.0.0'
  kind: site
site:
  brief: >-
    Build Common Ground Collective. An illustrative community nonprofit. Explain mission, programs and ways to participate with transparent limits. Do not invent charitable registration, tax deductibility, impact metrics, beneficiaries, donors, accounts or payment destinations. This is a fixed-scope sold package: implement exactly the listed pages and acceptance deliverables, at the shared flagship-quality bar. Replace example identity and facts with approved client content before sealing a real sale.
  pages:
    - path: /index.html
      title: Home
      purpose: Introduce the mission and link to programs and participation.
    - path: /mission.html
      title: Mission and governance
      purpose: Explain the illustrative mission and responsible governance questions; no fake trustees or registration.
    - path: /programs.html
      title: Programs
      purpose: Explain two clearly illustrative activities with intended audiences, scope and participation needs.
    - path: /impact.html
      title: Learning and accountability
      purpose: Describe an evaluation plan and proposed measures without claiming measured outcomes.
    - path: /get-involved.html
      title: Get involved
      purpose: Provide a local volunteer-interest worksheet with export and clear no-submission behavior.
    - path: /support.html
      title: Support the mission
      purpose: Explain how to verify a nonprofit and its approved donation channel; explicitly state no donations are collected here.
    - path: /404.html
      title: Page not found
      purpose: Provide recovery links to home and programs.
    - path: /privacy.html
      title: Privacy draft
      purpose: Preserve the noindex draft until approved operator and data-handling facts are supplied.
    - path: /terms.html
      title: Terms draft
      purpose: Preserve the noindex draft until reviewed service terms are supplied.
  style: editorial
  frontend: Semantic HTML, shared native CSS, minimal local JavaScript and original SVG assets. No frontend framework or package manager.
  backend: none
  database: none
  requirements: >-
    Give every route complete original content and a distinct composition within one recognizable visual system. Use relative links between flat HTML files and a shared header, navigation and footer; preserve every primary action without JavaScript. Display a clear illustrative-business disclosure on every page. Do not invent credibility or facts to fill missing inputs. No tracking or remote services; open-source font defaults may progressively enhance system fallbacks. Implement docs/acceptance.org with fixed route and behavior matrices and tests/check.sh with failing negative controls for missing routes and broken local references. Supply runnable browser accessibility checks as tests/accessibility.sh plus a manual keyboard/screen-reader procedure; do not claim execution. The final acceptance checks are exact source predicates, not browser certification. Implement a local volunteer-interest worksheet with required interest area and optional availability, selectable plain text preview and a real TXT download. No personal data required, storage, network or pretend application submission. Validate whitespace, handle Unicode, reset explicitly and release Blob URLs safely. State exactly: Nothing is sent. Download your interests and contact the organization separately. On support.html state exactly: This demonstration site does not collect donations. Do not invent payment links or tax claims.
ai:
  provider: codex
  timeout: 0
  retries: 2
  max_tokens: 0
pipeline:
  steps:
    - id: scaffold
      type: scaffold
      options: {profile: static}
    - id: brief
      type: brief
      instructions: >-
        Define the exact page/content/interaction contract and paid scope in docs/product.org. Explain exclusions and supplied-versus-missing facts. Draft docs/acceptance.org with each route, primary action, expected behavior, source check and unexecuted browser check. Do not expand the sold scope. Home must link to get-involved.html as a primary next action.
    - id: design
      type: design
      instructions: >-
        Establish a brand-specific visual thesis, original SVG motif, exact tokens and shared components. Design all page types and interaction states at 360, 768 and 1440px and 200 percent zoom. Give interior pages as much care as home, with readable longform and honest content. Avoid repeated hero-and-card layouts.
    - id: planning-check
      type: validate
      options:
        required: [docs/product.org, docs/design.org, docs/acceptance.org]
    - id: foundation
      type: generate
      prompt: foundation
      options:
        files: [index.html, styles.css, assets/mark.svg, assets/illustration.svg]
      instructions: >-
        Implement the complete home and shared visual system using the approved contract. The home primary action uses the literal relative href="get-involved.html". Deliver original SVG identity assets and working static navigation. Preserve selected font defaults with offline fallback. Match exact flat file routes; no empty anchors or future-service claims.
    - id: pages
      type: generate
      prompt: pages
      instructions: >-
        Complete every remaining page in site.pages and its stated purpose, including 404 recovery. Use native main landmarks and complete HTML documents on every route. Match shared styles and navigation exactly. Finish substantive route-specific copy and static fallbacks before enhancement; do not add pages or replace routes with home-page sections.
    - id: interactions
      type: generate
      prompt: interactions
      instructions: >-
        Implement a local volunteer-interest worksheet with required interest area and optional availability, selectable plain text preview and a real TXT download. No personal data required, storage, network or pretend application submission. Validate whitespace, handle Unicode, reset explicitly and release Blob URLs safely. State exactly: Nothing is sent. Download your interests and contact the organization separately. On support.html state exactly: This demonstration site does not collect donations. Do not invent payment links or tax claims. Wire a shared deferred site.js and update HTML as needed. Deliver ShellCheck-clean tests/check.sh, tests/accessibility.sh, tests/seo.sh with --help examples and --license, README.org, AGENTS.md, docs/testing.org and docs/acceptance.org. Source tests verify every route, local asset and primary action and must fail on deliberate missing-route and broken-link fixtures. Browser tests require a documented FOSS toolchain and must perform real assertions. Record responsive, keyboard, screen-reader, no-JS, offline and negative/valid/repeated-action procedures with expected results and unexecuted status.
    - id: polish
      type: generate
      prompt: polish
    - id: review
      type: review
      instructions: >-
        Repair all missing routes, broken local links, incomplete interaction states and invented claims. Check the route-to-acceptance matrix and missing-input disclosures. Preserve the fixed sold scope. Native predicates only establish artifact text; document all unexecuted browser/build checks honestly.
    - id: acceptance
      type: validate
      options:
        required:
          - index.html
          - mission.html
          - programs.html
          - impact.html
          - get-involved.html
          - support.html
          - 404.html
          - styles.css
          - site.js
          - assets/mark.svg
          - assets/illustration.svg
          - README.org
          - AGENTS.md
          - Makefile
          - privacy.html
          - terms.html
          - docs/contact.org
          - tests/scaffold.sh
          - docs/product.org
          - docs/design.org
          - docs/acceptance.org
          - docs/testing.org
          - docs/polish.org
          - docs/review.org
          - tests/check.sh
          - tests/accessibility.sh
          - config/seo.yaml
          - docs/seo.org
          - tests/seo.sh
          - robots.txt
          - scripts/prepare-seo.sh
        checks:
          - path: index.html
            contains: ['<main', '</html>', 'href="get-involved.html"']
          - path: mission.html
            contains: ['<main', '</html>']
          - path: programs.html
            contains: ['<main', '</html>']
          - path: impact.html
            contains: ['<main', '</html>']
          - path: get-involved.html
            contains: ['<main', '</html>', 'Nothing is sent. Download your interests and contact the organization separately.']
          - path: support.html
            contains: ['<main', '</html>', 'This demonstration site does not collect donations.']
          - path: 404.html
            contains: ['<main', '</html>']
          - path: docs/acceptance.org
            contains: ['#+title:', '360', '768', '1440']
          - path: privacy.html
            contains: ['<main', 'noindex']
          - path: terms.html
            contains: ['<main', 'noindex']
