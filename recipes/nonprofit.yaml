# SPDX-License-Identifier: AGPL-3.0-or-later
# Composed from the component library in two AI steps: one plan call, then every
# page and artwork in parallel. --provider switches every AI step to another agent.
version: 1
name: nonprofit-site
package:
  sku: nonprofit
  release: '2.0.0'
  kind: site
site:
  brief: >-
    Build Common Ground Collective. An illustrative community nonprofit. Explain mission, programs and ways to participate with transparent limits. Do not invent charitable registration, tax deductibility, impact metrics, beneficiaries, donors, accounts or payment destinations. This is a fixed-scope sold package: build exactly the listed pages. Replace example identity and facts with approved client content before sealing a real sale.
  pages:
    - path: /index.html
      title: Home
      purpose: Introduce the mission and link to programs and participation.
    - path: /mission.html
      title: Mission and governance
      purpose: Explain the illustrative mission and responsible governance questions; no fake trustees or registration.
    - path: /programs.html
      title: Programs
      purpose: Explain two clearly illustrative activities with intended audiences, scope and participation needs.
    - path: /impact.html
      title: Learning and accountability
      purpose: Describe an evaluation plan and proposed measures without claiming measured outcomes.
    - path: /get-involved.html
      title: Get involved
      purpose: Provide a local volunteer-interest worksheet with export and clear no-submission behavior.
    - path: /support.html
      title: Support the mission
      purpose: Explain how to verify a nonprofit and its approved donation channel; explicitly state no donations are collected here.
  style: editorial
  frontend: Static pages from the Libresite component library with original local SVG artwork. No framework, package manager, CDN or external font request.
  backend: none
  database: none
  requirements: >-
    6 planned routes: index.html, mission.html, programs.html, impact.html, get-involved.html, support.html (404, privacy and terms are built in). Plan a warm, credible community look with its own original motif (shared ground, hands, paths), not a generic charity template. Programs are clearly illustrative. Impact describes an evaluation plan and proposed measures, never measured outcomes. Support explains how to verify a nonprofit and its approved donation channel. No registration numbers, tax claims, beneficiaries, donors or payment links. Disclose in the shared footer that the business is illustrative. Do not invent credibility or facts to fill missing inputs; say plainly what was not supplied. No tracking, remote services, signup or pretend submission.
ai:
  provider: claude-code
  timeout: 0
  retries: 2
  max_tokens: 0
pipeline:
  steps:
    - id: plan
      type: plan
      instructions: >-
        Home introduces the mission with a hopeful opening; its actions are "Get involved" (get-involved.html) and "Our programs" (programs.html). Mission explains the illustrative mission and responsible governance questions, without trustees or registration. Programs explains two clearly illustrative activities with audience, scope and participation needs. Impact describes the evaluation plan and proposed measures. Get involved is a form page with a volunteer-interest worksheet. Support explains how to verify a nonprofit and its donation channel. Plan art: a mark, a community home composition and one program illustration.
    - id: design-gate
      type: gate
      options:
        message: >-
          Review the site plan (design tokens, fonts, navigation, art briefs and page outlines) before the pages are written.
          Resume with --approve design-gate when the direction is accepted.
        review: [site/plan.json]
    - id: pages
      type: pages
      options: {parallel: 12}
      instructions: >-
        Write final copy at the planned depth. The get-involved page uses a local form with fields interest area (required, select: events, mentoring, outreach or behind the scenes) and availability (optional textarea, up to 1000 characters); no personal data; the download file is volunteer-interests.txt; its note reads exactly "Nothing is sent. Download your interests and contact the organization separately." and its fallback explains copying the questions by hand. The support page states exactly "This demonstration site does not collect donations."
    - id: acceptance
      type: validate
      options:
        required: [index.html, mission.html, programs.html, impact.html, get-involved.html, support.html, 404.html, privacy.html, terms.html, styles.css, site.js, robots.txt]
        checks:
          - path: index.html
            contains: ['<main', '</html>', 'href="get-involved.html"']
          - path: mission.html
            contains: ['<main', '</html>']
          - path: programs.html
            contains: ['<main', '</html>']
          - path: impact.html
            contains: ['<main', '</html>']
          - path: get-involved.html
            contains: ['<main', '</html>', 'Nothing is sent. Download your interests and contact the organization separately.']
          - path: support.html
            contains: ['<main', '</html>', 'This demonstration site does not collect donations.']
          - path: 404.html
            contains: ['<main', 'href="index.html"']
          - path: privacy.html
            contains: ['<main', 'noindex']
          - path: terms.html
            contains: ['<main', 'noindex']
    # Outlines move to the run record so delivered sites can be recomposed.
    - id: build-notes
      type: prune
      options: {prefixes: [site/], archive: true}
