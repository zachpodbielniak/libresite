# SPDX-License-Identifier: AGPL-3.0-or-later
# Composed from the component library in two AI steps: one plan call, then every
# page and artwork in parallel. --provider switches every AI step to another agent.
version: 1
name: professional-services-site
package:
  sku: professional-services
  release: '2.0.0'
  kind: site
site:
  brief: >-
    Build Plainspoken Advisory. An illustrative independent operations consultancy. Explain scoped discovery, process mapping and documentation engagements for small teams. Do not invent clients, qualifications, testimonials, outcomes, fees or contact details. This is a fixed-scope sold package: build exactly the listed pages. Replace example identity and facts with approved client content before sealing a real sale.
  pages:
    - path: /index.html
      title: Home
      purpose: Explain the offer and link to engagements and the project brief.
    - path: /services.html
      title: Engagements
      purpose: Explain discovery and process mapping deliverables, boundaries and client responsibilities.
    - path: /engagement.html
      title: Discovery engagement
      purpose: Describe inputs, workshop agenda, concrete outputs and excluded implementation work.
    - path: /approach.html
      title: Working together
      purpose: Explain intake, review, decisions, handoff and maintenance responsibilities.
    - path: /insights.html
      title: An operating process people can use
      purpose: A complete practical article with worked illustrative examples and clearly stated limits.
    - path: /contact.html
      title: Prepare a project brief
      purpose: Local brief worksheet for problem, team context and constraints; export text without sending.
  style: minimalist
  frontend: Static pages from the Libresite component library with original local SVG artwork and open-source web fonts over system fallbacks. No framework, package manager or CDN scripts.
  backend: none
  database: none
  requirements: >-
    6 planned routes: index.html, services.html, engagement.html, approach.html, insights.html, contact.html (404, privacy and terms are built in). Plan a calm, precise advisory look with its own original diagram motif (process maps, flow lines), not a generic corporate template. Engagements explain deliverables, boundaries and client responsibilities. No clients, qualifications, testimonials, outcomes, fees or contact details. Disclose in the shared footer that the business is illustrative. Do not invent credibility or facts to fill missing inputs; say plainly what was not supplied. No tracking, remote services, signup or pretend submission.
ai:
  provider: claude-code
  timeout: 0
  retries: 2
  max_tokens: 0
pipeline:
  steps:
    - id: plan
      type: plan
      options: {sector: advisory}
      instructions: >-
        Home explains the offer with a clear, confident opening; its actions are "Prepare a project brief" (contact.html) and "See engagements" (services.html). Services explains discovery and process-mapping engagements with deliverables and what is excluded. Engagement describes the discovery engagement: inputs, workshop agenda as steps, concrete outputs and excluded implementation work. Approach explains intake, review, decisions, handoff and maintenance. Insights is a complete article of roughly 500 words, "An operating process people can use", with worked illustrative examples, stated limits and in-page contents. Contact is a form page with a project-brief worksheet. Plan art: a mark, a process-map home composition and one engagement diagram.
    - id: design-gate
      type: gate
      options:
        message: >-
          Review the site plan (design tokens, fonts, navigation, art briefs and page outlines) before the pages are written.
          Resume with --approve design-gate when the direction is accepted.
        review: [site/plan.json]
    - id: pages
      type: pages
      options: {parallel: 12}
      instructions: >-
        Write final copy at the planned depth. The contact page uses a local form with fields problem statement (required textarea, up to 2000 characters), team context (optional textarea, up to 1000 characters) and constraints (optional textarea, up to 1000 characters); no personal data; the download file is project-brief.txt; its note reads exactly "Nothing is sent. Download your brief and contact the consultancy separately." and its fallback explains copying the questions by hand.
    - id: acceptance
      type: validate
      options:
        required: [index.html, services.html, engagement.html, approach.html, insights.html, contact.html, 404.html, privacy.html, terms.html, styles.css, site.js, robots.txt]
        checks:
          - path: index.html
            contains: ['<main', '</html>', 'href="contact.html"']
          - path: services.html
            contains: ['<main', '</html>']
          - path: engagement.html
            contains: ['<main', '</html>']
          - path: approach.html
            contains: ['<main', '</html>']
          - path: insights.html
            contains: ['<main', '</html>']
          - path: contact.html
            contains: ['<main', '</html>', 'Nothing is sent. Download your brief and contact the consultancy separately.']
          - path: 404.html
            contains: ['<main', 'href="index.html"']
          - path: privacy.html
            contains: ['<main', 'noindex']
          - path: terms.html
            contains: ['<main', 'noindex']
    # Outlines move to the run record so delivered sites can be recomposed.
    - id: build-notes
      type: prune
      options: {prefixes: [site/], archive: true}
