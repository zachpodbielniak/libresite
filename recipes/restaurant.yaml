# SPDX-License-Identifier: AGPL-3.0-or-later
# Composed from the component library in two AI steps: one plan call, then every
# page and artwork in parallel. --provider switches every AI step to another agent.
version: 1
name: restaurant-site
package:
  sku: restaurant
  release: '2.0.0'
  kind: site
site:
  brief: >-
    Build Hearth Table. An illustrative neighborhood restaurant website. Make the menu readable as HTML and explain visiting and private-dining questions. The example menu and business are fictional. Do not invent opening hours, an address, prices, allergy assurances, reservation availability or delivery integrations. This is a fixed-scope sold package: build exactly the listed pages. Replace example identity and facts with approved client content before sealing a real sale.
  pages:
    - path: /index.html
      title: Home
      purpose: Introduce the dining concept and prioritize menu and visit links.
    - path: /menu.html
      title: Menu
      purpose: A clearly labeled illustrative menu organized as readable HTML; categories remain visible without script.
    - path: /story.html
      title: Our kitchen
      purpose: Explain the fictional dining concept without invented provenance, people or awards.
    - path: /visit.html
      title: Plan a visit
      purpose: Identify address, opening hours and accessibility details as not supplied; explain what to confirm before travel.
    - path: /private-dining.html
      title: Private dining
      purpose: Describe questions about party size, format and access without promising capacity or availability.
    - path: /reservations.html
      title: Reservation information
      purpose: Clearly state that reservations are not taken on this demonstration site; link to visit information.
  style: editorial
  frontend: Static pages from the Libresite component library with original local SVG artwork. No framework, package manager, CDN or external font request.
  backend: none
  database: none
  requirements: >-
    6 planned routes: index.html, menu.html, story.html, visit.html, private-dining.html, reservations.html (404, privacy and terms are built in). Plan an appetizing neighborhood-dining look with its own original line motif (hearth, bread, table), not a generic bistro template. The menu is readable HTML organized in sections, and every dish stays visible without JavaScript. Visit marks address, opening hours and accessibility details as not supplied and explains what to confirm before travel. No fake booking, map, delivery or payment integration. Disclose in the shared footer that the business is illustrative. Do not invent credibility or facts to fill missing inputs; say plainly what was not supplied. No tracking, remote services, signup or pretend submission.
ai:
  provider: claude-code
  timeout: 0
  retries: 2
  max_tokens: 0
pipeline:
  steps:
    - id: plan
      type: plan
      instructions: >-
        Home introduces the dining concept with an inviting opening; its actions are "See the menu" (menu.html) and "Plan a visit" (visit.html). Menu is a menu page: a menu component with four illustrative sections of dishes with short descriptions and no prices, and section filter buttons (set all_label to "Everything"). Story explains the kitchen's approach without invented provenance, people or awards. Visit explains what to confirm before travel, marking address, hours and access as not supplied. Private dining explains questions about party size, format and access without promising capacity. Reservations states that this site takes no reservations and links to visit.html. Plan art: a mark, a hearth-and-table home composition and one dish illustration.
    - id: design-gate
      type: gate
      options:
        message: >-
          Review the site plan (design tokens, fonts, navigation, art briefs and page outlines) before the pages are written.
          Resume with --approve design-gate when the direction is accepted.
        review: [site/plan.json]
    - id: pages
      type: pages
      options: {parallel: 12}
      instructions: >-
        Write final copy at the planned depth. The menu page's menu note reads exactly "Illustrative menu; confirm ingredients and allergens with the restaurant." The reservations page states exactly "This demonstration site does not take reservations." Never state prices, hours, an address or allergy assurances.
    - id: acceptance
      type: validate
      options:
        required: [index.html, menu.html, story.html, visit.html, private-dining.html, reservations.html, 404.html, privacy.html, terms.html, styles.css, site.js, robots.txt]
        checks:
          - path: index.html
            contains: ['<main', '</html>', 'href="menu.html"']
          - path: menu.html
            contains: ['<main', '</html>', 'Illustrative menu; confirm ingredients and allergens with the restaurant.']
          - path: story.html
            contains: ['<main', '</html>']
          - path: visit.html
            contains: ['<main', '</html>']
          - path: private-dining.html
            contains: ['<main', '</html>']
          - path: reservations.html
            contains: ['<main', '</html>', 'This demonstration site does not take reservations.']
          - path: 404.html
            contains: ['<main', 'href="index.html"']
          - path: privacy.html
            contains: ['<main', 'noindex']
          - path: terms.html
            contains: ['<main', 'noindex']
    # Outlines move to the run record so delivered sites can be recomposed.
    - id: build-notes
      type: prune
      options: {prefixes: [site/], archive: true}
