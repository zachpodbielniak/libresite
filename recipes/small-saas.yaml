# SPDX-License-Identifier: AGPL-3.0-or-later
# Composed from the component library in two AI steps: one plan call, then every
# page and artwork in parallel. --provider switches every AI step to another agent.
version: 1
name: small-saas-site
package:
  sku: small-saas
  release: '2.0.0'
  kind: site
site:
  brief: >-
    Build Signal Ledger. An illustrative open-source release-notes SaaS marketing site, sold separately from application implementation. Explain a proposed small-team release workflow. No live account, free trial, billing, integrations, uptime, customer counts or shipped-product claims. This is a fixed-scope sold package: build exactly the listed pages. Replace example identity and facts with approved client content before sealing a real sale.
  pages:
    - path: /index.html
      title: Home
      purpose: Explain the proposed release-notes workflow with links to features and the local walkthrough.
    - path: /features.html
      title: Features
      purpose: Explain drafting, review and publishing as an illustrative proposed workflow with clear limitations.
    - path: /pricing.html
      title: Plans and scope
      purpose: Compare illustrative scope tiers; prices and commercial terms are not supplied, no buy buttons.
    - path: /docs.html
      title: Workflow guide
      purpose: A complete worked illustrative release-note example with inputs, review decisions and handoff.
    - path: /about.html
      title: Ownership and support
      purpose: Explain open-source ownership and questions to resolve before launch, without invented support commitments.
    - path: /demo.html
      title: Local walkthrough
      purpose: A working local release-note preview; explicitly no account, persistence or network service.
  style: editorial
  frontend: Static pages from the Libresite component library with original local SVG artwork. No framework, package manager, CDN or external font request.
  backend: none
  database: none
  requirements: >-
    6 planned routes: index.html, features.html, pricing.html, docs.html, about.html, demo.html (404, privacy and terms are built in). Plan a crisp product-marketing look with its own original motif (release timelines, changelog marks), not a generic SaaS gradient template. Describe a proposed workflow, never a shipped product. Pricing compares illustrative scope tiers with prices and terms not supplied and no buy buttons. Explain that a working application is a separate c-glib + htmx-glib + orm-glib package. No login, signup, trial, billing, integrations, uptime or customer counts. Disclose in the shared footer that the business is illustrative. Do not invent credibility or facts to fill missing inputs; say plainly what was not supplied. No tracking, remote services, signup or pretend submission.
ai:
  provider: claude-code
  timeout: 0
  retries: 2
  max_tokens: 0
pipeline:
  steps:
    - id: plan
      type: plan
      instructions: >-
        Home explains the proposed release-notes workflow with a product-style opening; its actions are "Try the local walkthrough" (demo.html) and "See features" (features.html). Features explains drafting, review and publishing with clear limitations. Pricing compares three illustrative scope tiers with no prices. Docs is a complete worked release-note example as an article with steps: inputs, review decisions and handoff. About explains open-source ownership and questions to resolve before launch. Demo is a form page: a local release-note composer. Plan art: a mark, a release-timeline home composition and one workflow illustration.
    - id: design-gate
      type: gate
      options:
        message: >-
          Review the site plan (design tokens, fonts, navigation, art briefs and page outlines) before the pages are written.
          Resume with --approve design-gate when the direction is accepted.
        review: [site/plan.json]
    - id: pages
      type: pages
      options: {parallel: 12}
      instructions: >-
        Write final copy at the planned depth. The demo page uses a local form with fields title (required, up to 120 characters) and summary (required textarea, up to 2000 characters); the download file is release-note.txt; its note reads exactly "Local demonstration only; no account is created and nothing is published." and its fallback explains writing the note by hand.
    - id: acceptance
      type: validate
      options:
        required: [index.html, features.html, pricing.html, docs.html, about.html, demo.html, 404.html, privacy.html, terms.html, styles.css, site.js, robots.txt]
        checks:
          - path: index.html
            contains: ['<main', '</html>', 'href="demo.html"']
          - path: features.html
            contains: ['<main', '</html>']
          - path: pricing.html
            contains: ['<main', '</html>']
          - path: docs.html
            contains: ['<main', '</html>']
          - path: about.html
            contains: ['<main', '</html>']
          - path: demo.html
            contains: ['<main', '</html>', 'Local demonstration only; no account is created and nothing is published.']
          - path: 404.html
            contains: ['<main', 'href="index.html"']
          - path: privacy.html
            contains: ['<main', 'noindex']
          - path: terms.html
            contains: ['<main', 'noindex']
    # Outlines move to the run record so delivered sites can be recomposed.
    - id: build-notes
      type: prune
      options: {prefixes: [site/], archive: true}
