# SPDX-License-Identifier: AGPL-3.0-or-later
version: 1
name: libre-atelier
site:
  pages:
    - path: /
      title: Libre Atelier
      purpose: Introduce the studio and its engineering services.
      sections: [Introduction, Services, Approach]
    - path: /services/
      title: Services
      sections: [Systems engineering, Maintenance]
  offers:
    - id: systems
      name: Systems engineering
      description: Open-source C and GLib engineering.
      cta_label: Explore services
      cta_url: /services/
  contact: {}
  brand:
    name: Libre Atelier
    tagline: Software you can own.
    tone: Precise and approachable
    colors: Warm white, charcoal, muted green
    fonts: Open-source sans serif from Bunny Fonts
  copy_lock: ['Software you can own.']
  languages:
    default: en
    supported: [en, fr]
  style: editorial
  frontend: Semantic HTML and native CSS
  backend: none
  database: none
ai:
  timeout: 0
  max_tokens: 0
pipeline:
  steps:
    - id: scaffold
      type: scaffold
      options: {profile: static}
    - {id: product, type: brief}
    - {id: design, type: design}
    - id: design-gate
      type: gate
      options:
        message: Review docs/product.org and docs/design.org before implementing the frontend.
        review: [docs/product.org, docs/design.org]
    - {id: frontend, type: frontend}
    - {id: review, type: review}
    - id: acceptance
      type: validate
      options:
        required: [index.html, 404.html, services/index.html, privacy.html, terms.html, robots.txt]
        checks:
          - path: index.html
            contains: ['Software you can own.']
    # Build notes guide later steps; the delivered site does not include them.
    - id: build-notes
      type: prune
      options:
        paths: [docs/product.org, docs/design.org, docs/polish.org, docs/review.org]
