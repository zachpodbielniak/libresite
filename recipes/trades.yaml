# SPDX-License-Identifier: AGPL-3.0-or-later
# Composed from the component library in two AI steps: one plan call, then every
# page and artwork in parallel. --provider switches every AI step to another agent.
version: 1
name: trades-site
package:
  sku: trades
  release: '2.0.0'
  kind: site
site:
  brief: >-
    Build Copper & Gauge. An illustrative independent plumbing and heating business. Help homeowners understand service scope, coverage questions and the information needed to request an estimate. No emergency availability, licenses, service areas, prices, addresses or phone numbers may be invented. This is a fixed-scope sold package: build exactly the listed pages. Replace example identity and facts with approved client content before sealing a real sale.
  pages:
    - path: /index.html
      title: Home
      purpose: Introduce the business and link to services and the estimate worksheet.
    - path: /services.html
      title: Services
      purpose: Explain repair and maintenance scopes with exclusions and preparation steps.
    - path: /service-detail.html
      title: Repair visits
      purpose: Explain a diagnostic visit, customer preparation and factors affecting an estimate without invented prices.
    - path: /coverage.html
      title: Coverage and availability
      purpose: Explain how to confirm location and scheduling with the real business; mark unsupplied details as not provided.
    - path: /about.html
      title: Approach
      purpose: Explain care for the property and clear written scope without fake staff biographies or credentials.
    - path: /estimate.html
      title: Prepare an estimate request
      purpose: Local worksheet for job description and access constraints; export plain text and state that nothing is sent.
  style: editorial
  frontend: Static pages from the Libresite component library with original local SVG artwork. No framework, package manager, CDN or external font request.
  backend: none
  database: none
  requirements: >-
    6 planned routes: index.html, services.html, service-detail.html, coverage.html, about.html, estimate.html (404, privacy and terms are built in). Warm practical tone for homeowners. Plan a sturdy, trustworthy trade look with its own original pipe-and-gauge line motif, not a generic blue contractor template. Services and the repair-visit page explain scope, exclusions and preparation, never prices, licenses, areas served, hours or phone numbers. Coverage uses a checklist of what to confirm with the business, each unsupplied detail marked as not provided. Disclose in the shared footer that the business is illustrative. Do not invent credibility or facts to fill missing inputs; say plainly what was not supplied. No tracking, remote services, signup or pretend submission.
ai:
  provider: claude-code
  timeout: 0
  retries: 2
  max_tokens: 0
pipeline:
  steps:
    - id: plan
      type: plan
      instructions: >-
        Home introduces the business with a confident opening, then what a visit covers and how estimates work; its primary action is "Prepare an estimate request" linking to estimate.html, with a second action to services.html. Services lists repair and maintenance scopes (services component, no prices) with exclusions and preparation steps. Service detail explains a diagnostic visit step by step and the factors that change an estimate. Coverage explains how to confirm location and scheduling. About explains care for the property and clear written scope without staff biographies or credentials. Estimate is a form page. Plan art: a mark, a pipe-and-gauge home composition and one service illustration.
    - id: design-gate
      type: gate
      options:
        message: >-
          Review the site plan (design tokens, fonts, navigation, art briefs and page outlines) before the pages are written.
          Resume with --approve design-gate when the direction is accepted.
        review: [site/plan.json]
    - id: pages
      type: pages
      options: {parallel: 12}
      instructions: >-
        Write final copy at the planned depth. The estimate page uses a local form with fields job description (required textarea, up to 2000 characters) and access constraints (optional textarea, up to 1000 characters); no personal data; the download file is estimate-request.txt; its note reads exactly "Nothing is sent. Download your request and contact the business separately." and its fallback explains copying the questions by hand. Never promise emergency availability or booking confirmation.
    - id: acceptance
      type: validate
      options:
        required: [index.html, services.html, service-detail.html, coverage.html, about.html, estimate.html, 404.html, privacy.html, terms.html, styles.css, site.js, robots.txt]
        checks:
          - path: index.html
            contains: ['<main', '</html>', 'href="estimate.html"']
          - path: services.html
            contains: ['<main', '</html>']
          - path: service-detail.html
            contains: ['<main', '</html>']
          - path: coverage.html
            contains: ['<main', '</html>']
          - path: about.html
            contains: ['<main', '</html>']
          - path: estimate.html
            contains: ['<main', '</html>', 'Nothing is sent. Download your request and contact the business separately.']
          - path: 404.html
            contains: ['<main', 'href="index.html"']
          - path: privacy.html
            contains: ['<main', 'noindex']
          - path: terms.html
            contains: ['<main', 'noindex']
    # Outlines move to the run record so delivered sites can be recomposed.
    - id: build-notes
      type: prune
      options: {prefixes: [site/], archive: true}
